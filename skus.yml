# THE ONE PLACE A LEG'S STATUS IS DECLARED.
#
# WHY THIS FILE EXISTS. On 2026-09-17 the v12 release matrix carried ten
# publishing slugs. Nine of them named hardware no customer owns. One of those
# nine -- Orbitscope on a 1.46" panel -- failed to compile, so its launch-gate
# receipt was never written, so the publish gate correctly refused to advance
# version.txt, so `releases/latest/download/version.txt` returned 404 and EVERY
# DEVICE IN THE FLEET lost OTA discovery. A product that does not exist took the
# fleet's update channel down.
#
# The gate was right. The coupling was wrong: a leg that publishes nothing must
# not be able to withhold publication, and a leg that publishes a binary earns
# that power only because a customer can actually be running it.
#
# THE RULE, AND IT IS ENFORCED RATHER THAN DOCUMENTED:
#
#   status: shipping    MUST carry a slug. CI attaches firmware-<slug>.bin, a
#                       device can request it, and if this leg fails its gate
#                       the fleet's version.txt does NOT advance.
#
#   status: build-only  MUST NOT carry a slug. Compiled on every run so the tree
#                       cannot rot, publishes no asset, and CANNOT withhold
#                       version.txt however badly it fails.
#
#   status: retired     MUST NOT carry a slug, and is NOT BUILT: CI leaves it out of
#                       the matrix entirely, so it publishes nothing and is no
#                       longer compiled. The row stays so the decision stays
#                       visible and the env's code stays findable; promoting it
#                       back is a status change here, like any other.
#
# `scripts/skus.py --validate` refuses a build-only or retired row with a slug and a
# shipping row without one; `--sabotage` proves a retired row cannot be published. It runs in CI before anything is built, so the
# contradiction is a build error rather than a silent re-arming of a
# fleet-blocking leg.
#
# PROMOTING A SKU IS DELIBERATE AND VISIBLE: change `status` here, add the slug,
# and the diff says plainly that a new leg can now hold the fleet's updates
# hostage. That is the sentence somebody should have to read.
#
# The workflow matrix, scripts/check_release_envs.mjs and
# scripts/check-publish-receipts.sh all derive from this file. There is no
# second list.

skus:
  # ---- SHIPPING ------------------------------------------------------------
  # A customer can buy this today and a device in the field runs it.
  - { env: blipscope-s3-128, status: shipping, slug: s3-128 }
  # blipscope-s3-128-wxlook: the shipping env + -DWX_LOOK_AB, the weather look A/B bench (docs/wx-device.md, WD4
  # addendum 2). BUILD-ONLY, never a slug: CI builds it so its bench marker's --expect has a real image.
  - { env: blipscope-s3-128-wxlook, status: build-only }

  # ---- BUILD-ONLY ----------------------------------------------------------
  # Compiled so the tree does not rot. No slug, no asset, no fleet, no veto.
  #
  # Pro 2.1 is build-only PENDING A DECISION, not because it is known not to
  # ship. When it ships, this row gains `status: shipping` and a slug.
  - { env: blipscope-pro-s3-21, status: build-only }

  # missileer-s3-128: bring-up (USB keyboard, FEATURE_USB_OPEN, TinyUSB mode); no slug until it ships.
  - { env: missileer-s3-128, status: build-only }
  # missileer-photo: missileer-s3-128 + -DPHOTO_MODE, for product photos. BUILD-ONLY
  # FOREVER: compiled on every run so it cannot rot, and never given a slug, so no
  # release carries it and no OTA channel can serve it. scripts/check_photo_mode.mjs
  # fails CI if this row gains a slug or a shipping status.
  - { env: missileer-photo, status: build-only }
  # weatherscope-s3-128: the Weatherscope edition (docs/weatherscope-stage3.md). No slug until the OTA
  # identity check is on the fleet (Stage 3, section 3), so CI publishes nothing for it.
  - { env: weatherscope-s3-128, status: build-only }

  # Bring-up and harness envs. Never had slugs; listed so the matrix has one
  # source rather than this file plus a remainder hidden in the workflow.
  - { env: blipscope-pro-s3-175-amoled, status: build-only }
  - { env: animtest-s3-128, status: build-only }
  - { env: weatherscope-bench-s3-128, status: build-only }
  # the Wi-Fi join diagnostic bench env: the only build of include/JoinDiagScreen.h (docs/joindiag-ci.md)
  - { env: blipscope-s3-128-joindiag, status: build-only }
  # the card bench env: a chosen detail card opened with no hands, for /diag/fb pictures (docs/card-nophoto-fix.md,
  # section 5). Built on every run so its hook cannot rot; no slug, so it publishes nothing and withholds nothing.
  - { env: blipscope-s3-128-cardbench, status: build-only }

  # ---- RETIRED -------------------------------------------------------------
  # Not built, not published, no slug. Retired 2026-11-05 on Daniel's decision: the
  # 1.46" (s3-146) scopes will likely never be made or sold. Their code stays in the
  # repo. The newest release carrying an s3-146 asset is v12 (a prerelease); v18 has
  # none, and earlier releases are untouched (docs/weatherscope-stage3.md A12.105).
  - { env: blipscope-s3-146, status: retired }
  - { env: missileer-s3-146, status: retired }
  - { env: orbitscope-s3-146, status: retired }
  - { env: quakescope-s3-146, status: retired }
  - { env: quillscope-s3-146, status: retired }
  - { env: reelscope-s3-146, status: retired }
  - { env: claudescope-s3-146, status: retired }
  - { env: speedscope-s3-146, status: retired }
