# Typecheck + test the two Cloudflare Workers.
#
# firmware.yml builds every board; nothing ran the Worker suites, so ~213 tests
# only ever executed on a developer's machine. That was survivable when the proxy
# was the only Worker and its failure mode was "aircraft stop appearing". It is
# not survivable now that dashboard/ verifies Access tokens and writes the
# revocation denylist: a silent rot there is an open admin surface or a fleet
# that can't be cut off.
#
# Deliberately path-filtered. A firmware-only PR should not wait on Node.
name: workers

on:
  push:
    branches: [main]
    paths: ["proxy/**", "dashboard/**", ".github/workflows/workers.yml", ".github/workflows/photo-drift.yml"]
  pull_request:
    paths: ["proxy/**", "dashboard/**", ".github/workflows/workers.yml", ".github/workflows/photo-drift.yml"]

jobs:
  # The published photo manifest and the repo's manifest.json must name the same
  # photos. On 2026-09-16 they did not: the repo said 237, production said 238,
  # and the live credits page credited a photograph no device could fetch,
  # because nothing anywhere compared the two. This is that comparison.
  #
  # READ-ONLY -- two KV gets. It is a separate job rather than a step in `test`
  # so a network or credential problem reads as "the drift check could not run"
  # instead of "the Worker suite failed", which are different facts.
  manifest-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # SKIPPED LOUDLY, NEVER SILENTLY, when the token is absent -- a PR from a
      # fork gets no secrets, and a check that quietly passes in that case is
      # worse than one that is not there, because the green is read as an answer.
      # Same pattern as refresh-data.yml.
      - name: repo manifest vs published manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning title=manifest drift not checked::CLOUDFLARE_API_TOKEN is not set, so the repo manifest was NOT compared against production."
            echo '`CLOUDFLARE_API_TOKEN` is missing, so the photo manifest drift check did not run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python proxy/scripts/check-manifest-drift.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one Worker failing should not hide the other's result
      matrix:
        worker: [proxy, dashboard]
    defaults:
      run:
        working-directory: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.worker }}/package-lock.json

      # npm ci, not npm install: the lockfile is the thing under test alongside
      # the source, and a resolution that drifts in CI tests something nobody has.
      - run: npm ci

      # The leaderboard page is authored as proxy/pages/*.html and embedded into
      # a generated TS module. Without this check the failure is silent and slow:
      # someone edits the HTML, forgets to regenerate, every test still passes
      # against the OLD markup, and the deploy ships a page nobody has looked at.
      - name: Embedded pages are up to date
        if: matrix.worker == 'proxy'
        run: node scripts/embed-pages.mjs --check

      # Same reasoning for the self-hosted webfonts: fonts/ and the generated
      # module must agree, or the page requests a font the Worker does not have
      # and silently falls back to system type on every visitor's browser.
      # Deliberately NOT scripts/fetch-fonts.py --check, which would hit Google
      # on every CI run and make the build depend on a third party we removed the
      # page's dependency on.
      - name: Embedded fonts are up to date
        if: matrix.worker == 'proxy'
        run: node scripts/embed-fonts.mjs --check

      - run: npm run typecheck

      # The render-drift job must stay read-only: one KV-READ secret, dry runs
      # only, never the publish's write token. A YAML claim, so a check that runs;
      # the selftest proves each refusal can fire before the real file is judged.
      - name: photo-drift.yml is read-only
        if: matrix.worker == 'proxy'
        run: node scripts/check-drift-workflow.mjs --selftest && node scripts/check-drift-workflow.mjs

      # `npm run typecheck` covers src/ and test/ ONLY. Everything in proxy/scripts/
      # -- the ingest tools, the harvest tool, derive-device-key, check_release_envs
      # -- was unchecked until 2026-08-10, and `npx tsc --noEmit` would report
      # success against a file it had never opened (issue #208). It is a separate
      # config because scripts/ is Node and src/ is Workers; see tsconfig.scripts.json.
      #
      # Wiring it up immediately found two duplicate object keys in
      # suggest-commons.ts, where a later refined search query silently discarded
      # an earlier one.
      - name: Typecheck scripts/ (Node, separate config -- see #208)
        if: matrix.worker == 'proxy'
        run: npm run typecheck:scripts

      - run: npm test
