name: firmware

# Builds every Blipscope SKU. On a published GitHub Release it also attaches each SKU's
# binary as firmware-<slug>.bin plus a shared version.txt, which is what the on-device
# variant-aware OTA reads (the 1.46" downloads firmware-s3-146.bin, never another SKU's image).
# See RELEASING.md.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

permissions:
  contents: write   # needed to upload release assets

jobs:
  # Structural check on the config page, ahead of the builds because it is seconds
  # and catches a class of defect no compiler can see: the page must stay ONE
  # whole-form POST. A section that becomes its own <form>, a named control that
  # drifts outside it, or a `disabled` attribute inside it all compile perfectly
  # and silently clear every setting the POST did not mention -- the 2026-08-02
  # bug that cost a day and produced a wrong frame-budget conclusion (#130).
  # --selftest runs first so a checker that has stopped checking fails loudly
  # instead of passing everything. Also prints each page's flash size, so the
  # CONFIG_HTML trend is visible per-commit rather than measured when someone
  # gets suspicious.
  config-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the checker catches each violation
        run: python scripts/check-config-form.py --selftest
      - name: Every config page is a single whole form
        run: python scripts/check-config-form.py

  # Follow Mode's privacy invariant (docs/follow-mode-consolidated.md 17): the
  # aircraft a customer named must not leave the device, except in the ntfy body
  # they opted into by naming it. A tail number tied to a named person is not a
  # type code, and a rule that lives only in a comment gets violated in six
  # months by someone who does not know it exists.
  #
  # This is the WEAKER form and is labelled as such in the script's own header --
  # it reads the source, not the artifact. It earns its place anyway: it found a
  # Serial.printf of the target that had shipped in the stage-1 commit, in a file
  # whose header says the target must never be printed.
  #
  # --selftest first, same reasoning as config-form above, and more sharply here:
  # this checker has been wrong three times, and each time a passing run and a
  # clean codebase looked identical.
  follow-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the guard catches a leak, including the multi-line shape
        run: python scripts/check_follow_privacy.py --selftest
      - name: The follow target reaches exactly one outbound sink
        run: python scripts/check_follow_privacy.py

  # The ICAO country table is binary-searched, so "sorted and non-overlapping" is a
  # correctness precondition rather than a style rule -- and breaking it produces no
  # compiler error, just a few addresses that silently resolve to the wrong country
  # (or to none) and land as permanent wrong entries in an owner's lifelist.
  # --selftest first, same reasoning as config-form above.
  icao-country:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the checker catches each violation
        run: node scripts/check_icao_country.mjs --selftest
      - name: ICAO country table is sorted, non-overlapping, and resolves correctly
        run: node scripts/check_icao_country.mjs

  # Two range tables live in BOTH the firmware and the Worker on purpose:
  # MIL_RANGES (the device tags MIL offline; the Worker fills a truthful generic
  # operator) and NON_ICAO_RANGES (the device skips a request; the Worker still
  # answers the fleet in the field). Two copies of one fact is precisely the
  # arrangement that shipped a dead enrolment URL behind sixteen passing tests,
  # so each pair is checked against the OTHER rather than against itself.
  #
  # Drift is silent both ways, and self-camouflaging one way: a range wrongly in
  # the firmware's non-ICAO table blanks a real aircraft, which is the exact
  # symptom of the enrichment bug that table was added to cure.
  range-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the checker catches drift in either direction
        run: node scripts/check_range_parity.mjs --selftest
      - name: Firmware and proxy agree on the military and non-ICAO ranges
        run: node scripts/check_range_parity.mjs

  # The env named in the matrix below IS the product: whatever it builds becomes
  # firmware-<slug>.bin, which is what every device on that SKU downloads on its next
  # OTA. That link had no check and it broke silently -- the cloud feed lived in a
  # sibling -prodburn env CI never built, so the pilot boards would have updated
  # themselves into a build that never contacts the proxy. A non-cloud image does not
  # error; it goes quiet, which reads as an idle device rather than a fault.
  # --selftest first, same reasoning as the two checks above.
  release-envs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the checker catches each violation
        run: node scripts/check_release_envs.mjs --selftest
      - name: Every radar SKU in the matrix builds a production cloud image
        run: node scripts/check_release_envs.mjs

  # The launch gate itself scans linked binaries and so runs inside the build
  # matrix below, per SKU. What runs HERE is its MATRIX PARSER -- the part that
  # decides which images get scanned at all.
  #
  # That part gets its own job because its failure mode is silence: a parser that
  # returns fewer envs does not fail anything, it just omits SKUs from a table
  # whose remaining rows all say PASS. The first version of this selftest passed
  # against a parser broken on purpose; the note in the script says why and what
  # replaced it.
  adsbdb-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gate's matrix parser before the gate is trusted
        run: bash scripts/check-adsbdb-out.sh --selftest

  # The other half of the same idea, for the OTA gate rather than the images.
  #
  # Its failure mode is also silence: if the matrix parser returns no slugs, the
  # publish check has nothing to require and passes vacuously -- which would let
  # version.txt ship while a shipping SKU sat failed. Floor + anchor + selftest,
  # run here on every push so matrix drift surfaces long before a release night.
  publish-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the publish-receipt gate, both directions
        run: bash scripts/check-publish-receipts.sh --selftest

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per SKU. `env` = PlatformIO env; `slug` MUST equal variant::SLUG in
        # the variant header (it names the OTA asset). Add S3 SKUs here as they come online.
        include:
          - { env: blipscope-pro-s3-21,  slug: s3-21 }
          - { env: blipscope-s3-146,     slug: s3-146 }
          # FEATURE_EAM product (Missileer): same boards, EAM monitor firmware, own OTA channel
          # (firmware-eam-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: missileer-s3-146, slug: eam-s3-146 }
          # FEATURE_SPACE product (Orbitscope): same boards, own OTA channel
          # (firmware-space-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: orbitscope-s3-146, slug: space-s3-146 }
          # FEATURE_SEISMIC product (Quakescope): same boards, own OTA channel
          # (firmware-seismic-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: quakescope-s3-146, slug: seismic-s3-146 }
          # FEATURE_BIRDING product (Quillscope): same boards, own OTA channel
          # (firmware-birding-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: quillscope-s3-146, slug: birding-s3-146 }
          # FEATURE_FISHING product (Reelscope): same boards, own OTA channel
          # (firmware-fishing-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: reelscope-s3-146, slug: fishing-s3-146 }
          # FEATURE_CLAUDESCOPE product (Claudescope): same boards, own OTA channel
          # (firmware-claudescope-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: claudescope-s3-146, slug: claudescope-s3-146 }
          # FEATURE_SPEED product (Speedscope, MiniSpeedCam companion): same boards, own OTA
          # channel (firmware-speed-<slug>.bin -- the slug must match FW_OTA_PREFIX + variant::SLUG).
          - { env: speedscope-s3-146, slug: speed-s3-146 }
          # Kit S3: row activated 2026-07-15, on the wedge gate passing -- two clean
          # endurance runs (34 h 26 m / 38 h 35 m, zero device-attributed failures) and
          # the OTA path proven twice end-to-end. Per-batch acceptance for this SKU's
          # hardware lives in INCOMING-INSPECTION.md (the touch IC's factory config and
          # the u.FL antenna build are both silent, per-batch substitution risks).
          - { env: blipscope-s3-128, slug: s3-128 }
          # ---- COMPILE-ONLY ROWS -------------------------------------------------
          # A row with NO `slug` is built and scanned but publishes nothing: no
          # firmware-<slug>.bin, no CI artifact, no release asset. It exists because
          # "does it still compile" and "does it ship" are different questions, and
          # only the second one needs a slug.
          #
          # The 1.75" AMOLED is here rather than in the published rows above because
          # its variant header says, in capitals, that the pin map is UNVERIFIED
          # against the board wiki -- so it must not be flashed, let alone published
          # to an OTA channel. It also has no cloud feed, which check_release_envs
          # would correctly reject if it were a publishing row.
          #
          # What being absent from CI cost: the env stopped compiling and nobody
          # knew. It was found by hand, during a sweep that built all eleven images
          # rather than the ten CI knew about, and the break had been introduced by
          # the very change that sweep was checking. An env nothing builds is an env
          # that rots silently, and this row is what stops that.
          - { env: blipscope-pro-s3-175-amoled }
          # The flight-animation harness. Slug-less, and added 2026-08-27 when the
          # globe projection was extracted out of src/anim/ for Follow (§7.2).
          #
          # THE SAFETY NET THAT WAS ASSUMED TO COVER THIS DOES NOT. missileer-s3-146
          # is in this matrix and builds green, but every EAM env applies
          # ${filters.anim_off}, so src/anim/ IS NOT IN THE MISSILEER IMAGE AT ALL --
          # confirmed by grepping its ELF for FlightAnimation/kCoast/GOLF-07 (all
          # absent) against an anchor that is present. A refactor of the animation
          # module could therefore break every env that actually contains it while
          # the Missileer row stayed green, which is the same shape as the 1.75"
          # AMOLED above: an env nothing builds is an env that rots silently.
          #
          # animtest-s3-128 is the only env that compiles AND renders src/anim/.
          - { env: animtest-s3-128 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      # The launch gate, per SKU: plant a reachable adsbdb endpoint, require the
      # scanner to FIND it in this env's image, unplant, rebuild, and scan for
      # real. A scanner proven against one binary has not been proven against the
      # next, so the control is planted per env rather than once.
      #
      # It runs BEFORE the binary is named and uploaded, and it leaves a clean
      # rebuild in .pio -- so the image attached to a release is the exact image
      # this scanned, and an unplant that silently failed shows up as ENDPOINT=1
      # here instead of as a planted string in a shipped binary.
      - name: adsbdb launch gate (${{ matrix.env }})
        run: bash scripts/check-adsbdb-out.sh ${{ matrix.env }}
      # The gate prints the tail of the failing build's log inline, which is
      # usually enough. This keeps the whole thing when it is not: a control that
      # comes back blind is exactly the case where the interesting line is above
      # the tail. Guarded by failure() so green runs upload nothing.
      - name: Gate build logs (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gatelogs-${{ matrix.env }}
          path: .pio/gatelogs/
          if-no-files-found: ignore
      # Everything below publishes, so everything below is skipped on a
      # compile-only row.
      - name: Name binary by slug
        if: matrix.slug
        run: cp ".pio/build/${{ matrix.env }}/firmware.bin" "firmware-${{ matrix.slug }}.bin"
      - name: Upload CI artifact
        if: matrix.slug
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.slug }}
          path: firmware-${{ matrix.slug }}.bin
      - name: Attach to release
        if: github.event_name == 'release' && matrix.slug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "$tag" "firmware-${{ matrix.slug }}.bin" --clobber
      # PUBLICATION RECEIPT -- evidence about THIS run, not about the release.
      #
      # Written only after the launch gate AND the upload above have both
      # succeeded. "firmware-<slug>.bin exists on the release" would NOT do:
      # that is equally true of a stale asset from an earlier run whose gate
      # failed, which is precisely the state version.txt must refuse to bless.
      #
      # The discriminator is matrix.slug -- the same field that decides whether
      # this leg publishes anything at all. A harness row emits no receipt
      # because none is expected of it, and that is what stops it withholding
      # the fleet's OTA gate. See scripts/check-publish-receipts.sh.
      - name: Publication receipt
        if: github.event_name == 'release' && matrix.slug
        run: |
          mkdir -p receipts
          echo "${{ matrix.slug }} published from ${{ github.sha }}" > "receipts/${{ matrix.slug }}"
      - name: Upload publication receipt
        if: github.event_name == 'release' && matrix.slug
        uses: actions/upload-artifact@v4
        with:
          name: pubok-${{ matrix.slug }}
          path: receipts/${{ matrix.slug }}

  version:
    # Publish the shared version gate once per release -- but ONLY once every
    # PUBLISHING SKU has actually published.
    #
    # `needs: build` is kept for ORDERING (wait for the matrix to finish) and
    # always() stops the matrix AGGREGATE from deciding anything. GitHub hands a
    # dependent job one result for every leg, so before this change a slug-less
    # harness env could withhold version.txt from the entire fleet: on
    # 2026-09-01 animtest-s3-128 failed the adsbdb gate's anchor control, this
    # job was skipped, and v9's OTA gate 404'd while ten verified binaries sat
    # on the release.
    #
    # THE DIRECTION IS PRESERVED AND IS THE ENTIRE POINT. A slug-FUL leg that
    # fails leaves no receipt, the check below fails, and version.txt does NOT
    # advance -- devices must never be pointed at an image no launch gate
    # certified. Only harness legs stopped being load-bearing.
    if: always() && github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before its verdict is used, same rule as the adsbdb gate: a check that
      # cannot be shown to fail is not evidence.
      - name: Prove the receipt gate can fail before trusting it
        run: bash scripts/check-publish-receipts.sh --selftest
      # No receipts at all must FAIL, not vacuously pass. If this step errors
      # because nothing matched, that is the safe direction and version.txt
      # stays put.
      - name: Collect publication receipts
        uses: actions/download-artifact@v4
        with:
          pattern: pubok-*
          merge-multiple: true
          path: receipts
      - name: Every publishing SKU must have published
        run: bash scripts/check-publish-receipts.sh receipts
      - name: Extract FW_VERSION -> version.txt
        run: |
          v=$(grep -oP 'FW_VERSION\s*=\s*\K[0-9]+' src/OtaUpdater.h)
          echo "FW_VERSION=$v"
          echo "$v" > version.txt
      - name: Publish version.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" version.txt --clobber
