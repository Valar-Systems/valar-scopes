name: firmware

# Builds every Blipscope SKU. On a published GitHub Release it also attaches each SKU's
# binary as firmware-<slug>.bin plus a shared version.txt, which is what the on-device
# variant-aware OTA reads (the 1.46" downloads firmware-s3-146.bin, never another SKU's image).
# See RELEASING.md.

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [ published ]

permissions:
  contents: write   # needed to upload release assets

jobs:
  # Structural check on the config page, ahead of the builds because it is seconds
  # and catches a class of defect no compiler can see: the page must stay ONE
  # whole-form POST. A section that becomes its own <form>, a named control that
  # drifts outside it, or a `disabled` attribute inside it all compile perfectly
  # and silently clear every setting the POST did not mention -- the 2026-08-02
  # bug that cost a day and produced a wrong frame-budget conclusion (#130).
  # --selftest runs first so a checker that has stopped checking fails loudly
  # instead of passing everything. Also prints each page's flash size, so the
  # CONFIG_HTML trend is visible per-commit rather than measured when someone
  # gets suspicious.
  config-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the checker catches each violation
        run: python scripts/check-config-form.py --selftest
      - name: Every config page is a single whole form
        run: python scripts/check-config-form.py

  # Follow Mode's privacy invariant (docs/follow-mode-consolidated.md 17): the
  # aircraft a customer named must not leave the device, except in the ntfy body
  # they opted into by naming it. A tail number tied to a named person is not a
  # type code, and a rule that lives only in a comment gets violated in six
  # months by someone who does not know it exists.
  #
  # This is the WEAKER form and is labelled as such in the script's own header --
  # it reads the source, not the artifact. It earns its place anyway: it found a
  # Serial.printf of the target that had shipped in the stage-1 commit, in a file
  # whose header says the target must never be printed.
  #
  # --selftest first, same reasoning as config-form above, and more sharply here:
  # this checker has been wrong three times, and each time a passing run and a
  # clean codebase looked identical.
  follow-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove the guard catches a leak, including the multi-line shape
        run: python scripts/check_follow_privacy.py --selftest
      - name: The follow target reaches exactly one outbound sink
        run: python scripts/check_follow_privacy.py

  # The ICAO country table is binary-searched, so "sorted and non-overlapping" is a
  # correctness precondition rather than a style rule -- and breaking it produces no
  # compiler error, just a few addresses that silently resolve to the wrong country
  # (or to none) and land as permanent wrong entries in an owner's lifelist.
  # --selftest first, same reasoning as config-form above.
  icao-country:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the checker catches each violation
        run: node scripts/check_icao_country.mjs --selftest
      - name: ICAO country table is sorted, non-overlapping, and resolves correctly
        run: node scripts/check_icao_country.mjs

  # Two range tables live in BOTH the firmware and the Worker on purpose:
  # MIL_RANGES (the device tags MIL offline; the Worker fills a truthful generic
  # operator) and NON_ICAO_RANGES (the device skips a request; the Worker still
  # answers the fleet in the field). Two copies of one fact is precisely the
  # arrangement that shipped a dead enrolment URL behind sixteen passing tests,
  # so each pair is checked against the OTHER rather than against itself.
  #
  # Drift is silent both ways, and self-camouflaging one way: a range wrongly in
  # the firmware's non-ICAO table blanks a real aircraft, which is the exact
  # symptom of the enrichment bug that table was added to cure.
  range-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the checker catches drift in either direction
        run: node scripts/check_range_parity.mjs --selftest
      - name: Firmware and proxy agree on the military and non-ICAO ranges
        run: node scripts/check_range_parity.mjs

  # The env named in the matrix below IS the product: whatever it builds becomes
  # firmware-<slug>.bin, which is what every device on that SKU downloads on its next
  # OTA. That link had no check and it broke silently -- the cloud feed lived in a
  # sibling -prodburn env CI never built, so the pilot boards would have updated
  # themselves into a build that never contacts the proxy. A non-cloud image does not
  # error; it goes quiet, which reads as an idle device rather than a fault.
  # --selftest first, same reasoning as the two checks above.
  # WHO ELSE READS THE BUILD MATRIX -- swept, not remembered. On 2026-09-17 the
  # matrix moved into skus.yml, four consumers were updated from a list someone
  # had in mind, and the fifth kept parsing the workflow, found no rows, and
  # refused to scan -- which withheld version.txt and cost the fleet OTA
  # discovery. This fails when a file starts reading the workflow unreviewed,
  # when a MIN_* row-count floor comes back, or when an allowlist entry goes
  # stale, because a list that accumulates dead entries decays back into the
  # hand-maintained one that failed.
  sku-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches each violation
        run: python3 scripts/skus.py --check-readers-selftest
      - name: No unreviewed reader of the build matrix
        run: python3 scripts/skus.py --check-readers

  # The commit a release is TAGGED from supplies the workflow that release runs,
  # so a tag cut from the wrong shape runs that shape: no promote job means a
  # prerelease forever, and an ungated one moves the fleet with nobody looking.
  # RELEASING.md runs this against the exact commit before the tag is pushed;
  # here it keeps main itself from losing the gate.
  tag-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the checker catches each violation
        run: bash scripts/check-tag-workflow.sh --selftest
      - name: This commit promotes only from the gated promote job
        run: bash scripts/check-tag-workflow.sh HEAD

  release-envs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prove the checker catches each violation
        run: node scripts/check_release_envs.mjs --selftest
      - name: Every radar SKU in the matrix builds a production cloud image
        run: node scripts/check_release_envs.mjs

  # The launch gate itself scans linked binaries and so runs inside the build
  # matrix below, per SKU. What runs HERE is its MATRIX PARSER -- the part that
  # decides which images get scanned at all.
  #
  # That part gets its own job because its failure mode is silence: a parser that
  # returns fewer envs does not fail anything, it just omits SKUs from a table
  # whose remaining rows all say PASS. The first version of this selftest passed
  # against a parser broken on purpose; the note in the script says why and what
  # replaced it.
  adsbdb-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the gate's matrix parser before the gate is trusted
        run: bash scripts/check-adsbdb-out.sh --selftest

  # The other half of the same idea, for the OTA gate rather than the images.
  #
  # Its failure mode is also silence: if the matrix parser returns no slugs, the
  # publish check has nothing to require and passes vacuously -- which would let
  # version.txt ship while a shipping SKU sat failed. Floor + anchor + selftest,
  # run here on every push so matrix drift surfaces long before a release night.
  publish-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prove the publish-receipt gate, both directions
        run: bash scripts/check-publish-receipts.sh --selftest

  # ---------------------------------------------------------------------------
  # skus.yml is the one place a leg's status is declared. Validated here, BEFORE
  # anything is compiled, so a contradiction -- a build-only leg carrying a slug,
  # a shipping leg without one -- stops the run immediately instead of surfacing
  # as a mystery at publish time.
  skus:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The validator's own selftest runs FIRST, and its failure is a RIG
      # failure: a checker that cannot refuse is indistinguishable from a file
      # that is correct.
      - name: The validator must be able to refuse
        run: python3 scripts/skus.py --selftest
      - name: Validate skus.yml
        run: python3 scripts/skus.py --validate
      - id: gen
        name: Emit the build matrix
        run: echo "matrix=$(python3 scripts/skus.py --matrix-json)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: skus
    strategy:
      fail-fast: false
      # THE MATRIX IS skus.yml. It used to be an inline list here, and on
      # 2026-09-17 nine of its ten rows carried slugs naming hardware no
      # customer owns. One failed to compile, its receipt was never written, and
      # the publish gate correctly withheld version.txt -- so the whole fleet
      # lost OTA discovery over a product that does not exist.
      #
      # `slug` is still the discriminator every step below reads. It is simply
      # no longer typed in two places that can disagree.
      matrix: ${{ fromJSON(needs.skus.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
      # The launch gate, per SKU: plant a reachable adsbdb endpoint, require the
      # scanner to FIND it in this env's image, unplant, rebuild, and scan for
      # real. A scanner proven against one binary has not been proven against the
      # next, so the control is planted per env rather than once.
      #
      # It runs BEFORE the binary is named and uploaded, and it leaves a clean
      # rebuild in .pio -- so the image attached to a release is the exact image
      # this scanned, and an unplant that silently failed shows up as ENDPOINT=1
      # here instead of as a planted string in a shipped binary.
      - name: adsbdb launch gate (${{ matrix.env }})
        run: bash scripts/check-adsbdb-out.sh ${{ matrix.env }}
      # THE FACTORY IMAGE IS PUBLISHED FROM CI, AND THAT IS A SAFETY CONTROL, NOT A
      # CONVENIENCE. The local build path (provision-batch.py, a bench `pio run`) can
      # bake a -DCLOUD_FEED_KEY="..." flag into the image -- platformio.ini invites
      # one -- and every board flashed from that image would carry the key. CI never
      # sets it: no workflow here names CLOUD_FEED_KEY or PLATFORMIO_BUILD_FLAGS.
      # So valar-flasher flashes THIS image, and the scan below runs on it before
      # anything from this leg is uploaded, the OTA binary included.
      #
      # flash_manifest.py reads every offset from the built artifact and PROVES the
      # regions, laid on 0xFF, reproduce the factory image byte for byte with none
      # touching NVS. That is what lets the flasher update a customer's board over
      # USB without erasing its settings.
      - name: Factory image, flash manifest and region files
        if: matrix.slug
        run: |
          python3 scripts/flash_manifest.py --selftest
          v=$(grep -oP '^\s*constexpr\s+int\s+FW_VERSION\s*=\s*\K[0-9]+' src/OtaUpdater.h)
          python3 scripts/flash_manifest.py --build ".pio/build/${{ matrix.env }}" \
            --slug "${{ matrix.slug }}" --env "${{ matrix.env }}" \
            --boot-app0 "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            --out publish --fw-version "$v" --commit "${{ github.sha }}"
      # NO SECRET IN THE IMAGE. The key names, token prefixes and Bearer are a hit on
      # sight. A 64-hex run (device-key shape) or a 40-char token-shaped run is a hit
      # unless it is found verbatim in a PUBLIC input of this build -- frameworks
      # carry both shapes as public data, and a key baked in by a build flag is in
      # none of them. The repo's only traced file is the public CA roots -- a string
      # that lives elsewhere in the repo is not "public" merely by being committed. Three controls run first (anchor found, a planted key
      # flagged, a planted 40-char run untraced); a failed control is exit 3,
      # untrustworthy, and fails this leg like a hit does. Prints counts, classes and
      # offsets only -- never a matched string. factory-scan-<slug>.json carries the
      # traced runs' sha256s so valar-flasher can run the same scan before a write.
      - name: No secret in the factory image
        if: matrix.slug
        run: |
          python3 scripts/scan_image.py --selftest
          python3 scripts/scan_image.py "publish/firmware-${{ matrix.slug }}.factory.bin" \
            --anchor "[build] env=" \
            --trace include/OtaCerts.h \
            --trace ".pio/libdeps/${{ matrix.env }}" \
            --trace "$HOME/.platformio/packages" \
            --emit "publish/factory-scan-${{ matrix.slug }}.json"
      # The gate prints the tail of the failing build's log inline, which is
      # usually enough. This keeps the whole thing when it is not: a control that
      # comes back blind is exactly the case where the interesting line is above
      # the tail. Guarded by failure() so green runs upload nothing.
      - name: Gate build logs (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gatelogs-${{ matrix.env }}
          path: .pio/gatelogs/
          if-no-files-found: ignore
      # A RED SHIPPING LEG HAS TO REACH A PERSON. A red BUILD-ONLY leg must not.
      #
      # `matrix.slug` is the discriminator, and it comes from skus.yml -- so a
      # build-only leg cannot raise this however badly it fails, and nobody has
      # to maintain a list of which legs are noisy. That distinction is the
      # whole lesson of 2026-09-17: orbitscope was red on every push to main for
      # weeks, GitHub emailed about it every time, and the alerts trained
      # everyone to read past a failing matrix.
      - name: Mark that a SHIPPING leg failed
        if: failure() && matrix.slug
        run: |
          mkdir -p shipfail
          echo "${{ matrix.env }} (${{ matrix.slug }}) failed on ${{ github.sha }}" \
            > "shipfail/${{ matrix.slug }}"
      - name: Upload the shipping-failure marker
        if: failure() && matrix.slug
        uses: actions/upload-artifact@v4
        with:
          name: shipfail-${{ matrix.slug }}
          path: shipfail/
          retention-days: 7
      # Everything below publishes, so everything below is skipped on a
      # compile-only row.
      - name: Name binary by slug
        if: matrix.slug
        run: cp ".pio/build/${{ matrix.env }}/firmware.bin" "firmware-${{ matrix.slug }}.bin"
      - name: Upload CI artifact
        if: matrix.slug
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.slug }}
          path: |
            firmware-${{ matrix.slug }}.bin
            publish/
      - name: Attach to release
        if: github.event_name == 'release' && matrix.slug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          s="${{ matrix.slug }}"
          gh release upload "$tag" "firmware-$s.bin" --clobber
          # The flasher's set. firmware-$s.bin above is the manifest's app region
          # (flash_manifest.py proved the bytes equal), so it is not uploaded twice.
          gh release upload "$tag" --clobber \
            "publish/firmware-$s.factory.bin" "publish/flash-manifest-$s.json" \
            "publish/bootloader-$s.bin" "publish/partitions-$s.bin" "publish/boot_app0-$s.bin" \
            "publish/factory-scan-$s.json"
      # PUBLICATION RECEIPT -- evidence about THIS run, not about the release.
      #
      # Written only after the launch gate AND the upload above have both
      # succeeded. "firmware-<slug>.bin exists on the release" would NOT do:
      # that is equally true of a stale asset from an earlier run whose gate
      # failed, which is precisely the state version.txt must refuse to bless.
      #
      # The discriminator is matrix.slug -- the same field that decides whether
      # this leg publishes anything at all. A harness row emits no receipt
      # because none is expected of it, and that is what stops it withholding
      # the fleet's OTA gate. See scripts/check-publish-receipts.sh.
      - name: Publication receipt
        if: github.event_name == 'release' && matrix.slug
        run: |
          mkdir -p receipts
          echo "${{ matrix.slug }} published from ${{ github.sha }}" > "receipts/${{ matrix.slug }}"
      - name: Upload publication receipt
        if: github.event_name == 'release' && matrix.slug
        uses: actions/upload-artifact@v4
        with:
          name: pubok-${{ matrix.slug }}
          path: receipts/${{ matrix.slug }}

  # ---------------------------------------------------------------------------
  # A SHIPPING LEG WENT RED ON main. Tell somebody.
  #
  # Scoped to push-on-main deliberately: a release failure already stops
  # version.txt and is loud by construction, whereas a push failure is the one
  # that sits unread for weeks. This is the reader the ledger keeps asking for --
  # an instrument nobody reads is worth less than none, because the green beside
  # it vouches for the thing it cannot see.
  ship-alert:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shipfail-*
          merge-multiple: true
          path: shipfail
        continue-on-error: true
      - name: Notify if a shipping SKU is broken on main
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          shopt -s nullglob
          legs=(shipfail/*)
          if [ ${#legs[@]} -eq 0 ]; then
            echo "No shipping leg failed. (Build-only legs are deliberately silent.)"
            exit 0
          fi
          body="Blipscope: a SHIPPING SKU is broken on main."
          for f in "${legs[@]}"; do body="$body"$'\n'"$(cat "$f")"; done
          body="$body"$'\n'"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "$body"
          # A MISSING TOPIC MUST BE LOUD. Silently not alerting is the exact
          # failure this job exists to end, so an unset secret fails the job
          # rather than letting the run go green with nobody told.
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "::error::A shipping SKU failed and NTFY_TOPIC is not set, so nobody was told." >&2
            exit 1
          fi
          curl -sS --fail -H "Title: Blipscope shipping SKU red on main" \
               -H "Priority: high" -H "Tags: rotating_light" \
               -d "$body" "https://ntfy.sh/$NTFY_TOPIC"
          echo "alert sent"
          exit 1   # the run stays red: the leg really is broken

  version:
    # Publish the shared version gate once per release -- but ONLY once every
    # PUBLISHING SKU has actually published.
    #
    # `needs: build` is kept for ORDERING (wait for the matrix to finish) and
    # always() stops the matrix AGGREGATE from deciding anything. GitHub hands a
    # dependent job one result for every leg, so before this change a slug-less
    # harness env could withhold version.txt from the entire fleet: on
    # 2026-09-01 animtest-s3-128 failed the adsbdb gate's anchor control, this
    # job was skipped, and v9's OTA gate 404'd while ten verified binaries sat
    # on the release.
    #
    # THE DIRECTION IS PRESERVED AND IS THE ENTIRE POINT. A slug-FUL leg that
    # fails leaves no receipt, the check below fails, and version.txt does NOT
    # advance -- devices must never be pointed at an image no launch gate
    # certified. Only harness legs stopped being load-bearing.
    if: always() && github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Before its verdict is used, same rule as the adsbdb gate: a check that
      # cannot be shown to fail is not evidence.
      - name: Prove the receipt gate can fail before trusting it
        run: bash scripts/check-publish-receipts.sh --selftest
      # No receipts at all must FAIL, not vacuously pass. If this step errors
      # because nothing matched, that is the safe direction and version.txt
      # stays put.
      - name: Collect publication receipts
        uses: actions/download-artifact@v4
        with:
          pattern: pubok-*
          merge-multiple: true
          path: receipts
      - name: Every publishing SKU must have published
        id: receipts
        run: bash scripts/check-publish-receipts.sh receipts
      # THE RECOVERY, AUTOMATED. On 2026-09-17 and again on 2026-09-18 a release
      # was published as a FULL release, its matrix failed, this gate correctly
      # withheld version.txt -- and because the release was already `latest`,
      # releases/latest/download/version.txt returned 404 for every device in the
      # fleet. Both times the gate was right and the fleet went dark anyway,
      # because the damage happened at CREATE time, before any job could run.
      #
      # Demoting restores `latest` to the last release that WAS certified, which
      # is the recovery that was performed by hand on both occasions.
      - name: Gate failed -- demote this release so `latest` moves back
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          echo "::error::$tag did not certify. Demoting it to a prerelease so that"
          echo "::error::releases/latest stops pointing at it and devices keep discovering"
          echo "::error::the last release that passed."
          # ONE SWITCH, MEASURED. This step used to apply `--prerelease` AND
          # `--latest=false`, so a pass said nothing about which one did the work.
          # Isolated on a live release on 2026-09-20, one switch at a time:
          #
          #   --prerelease alone      -> latest moved away     LOAD-BEARING
          #   --latest=false alone    -> latest did NOT move    INERT
          #   --prerelease=false      -> latest moved back     LOAD-BEARING
          #   --latest alone          -> latest did NOT move    INERT
          #
          # `--latest` was decoration beside the switch doing the job. An edit that
          # kept it and dropped `--prerelease` would fail SILENTLY on release night,
          # leaving a failed release as `latest` with no version.txt -- the outage
          # this step exists to undo. Same shape as the config page's None chip,
          # where an inline opacity and a class both appeared to dim it and only
          # one of them did.
          gh release edit "$tag" --prerelease
          gh release view "$tag" --json isPrerelease -q '"demoted: prerelease=\(.isPrerelease)"'
      - name: Extract FW_VERSION -> version.txt
        run: |
          # ANCHORED ON THE DECLARATION, AND EXACTLY ONE. The previous pattern
          # took the first FW_VERSION-ish match anywhere in the file, which is
          # correct today and silently wrong the day a comment or a second
          # constant mentions it above line 17 -- and what it would publish is
          # the number every device in the fleet compares against its own.
          decls=$(grep -cP '^\s*constexpr\s+int\s+FW_VERSION\s*=\s*[0-9]+\s*;' src/OtaUpdater.h || true)
          if [ "$decls" -ne 1 ]; then
            echo "::error::expected exactly one 'constexpr int FW_VERSION' declaration in"
            echo "::error::src/OtaUpdater.h, found $decls. Refusing to guess which one the"
            echo "::error::fleet should be pointed at."
            exit 1
          fi
          v=$(grep -oP '^\s*constexpr\s+int\s+FW_VERSION\s*=\s*\K[0-9]+' src/OtaUpdater.h)
          case "$v" in
            ''|*[!0-9]*) echo "::error::FW_VERSION parsed as '$v', which is not a number"; exit 1 ;;
          esac
          echo "FW_VERSION=$v"
          echo "$v" > version.txt
      - name: Publish version.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" version.txt --clobber

  promote:
    # PROMOTION WAITS FOR A PERSON. `version` has certified the release and put
    # version.txt on it; this job moves `latest`, which is the moment the fleet
    # starts downloading. The `release` environment has a required reviewer, so
    # the run pauses here until Daniel has flashed one bench board from the
    # exact asset on the prerelease and approved it (RELEASING.md step 5).
    # Rejecting leaves the release a prerelease and `latest` where it was.
    #
    # THE PROPERTY IS "ONLY A SUCCESSFUL `version` REACHES THIS JOB", and it is
    # stated as `needs.version.result == 'success'`, not left to a default.
    #
    # The default is wrong here. An `if:` with no status function gets an
    # implicit success(), and that success() is over EVERY ancestor, not only
    # `needs:`. The build matrix is an ancestor, and a slug-less harness leg
    # failing there skipped this job on 2026-09-22 (scratch run 35816020466):
    # `version` passed, `promote` was skipped without waiting for review, and a
    # real release would have stayed a prerelease forever. That is the same
    # coupling the `version` job's always() exists to break (see its v9 note).
    #
    # So `!cancelled()` stops the ancestry deciding, and the explicit result
    # check keeps a failed or skipped `version` out. Both halves are required by
    # scripts/check-tag-workflow.sh.
    if: ${{ !cancelled() && github.event_name == 'release' && needs.version.result == 'success' }}
    needs: version
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ORDER IS PROVEN HERE, NOT BY WHERE A LINE SITS. This reads version.txt
      # from THIS release's own download URL, the same file the fleet will get
      # through `latest` once the next step runs, and requires it to equal
      # FW_VERSION in the tagged source. If it is missing or wrong, promotion
      # does not happen. `latest` is not read here: until promotion it points
      # at the previous release, and a match there would prove nothing.
      - name: version.txt on this release must equal FW_VERSION
        run: |
          tag="${{ github.event.release.tag_name }}"
          decls=$(grep -cP '^\s*constexpr\s+int\s+FW_VERSION\s*=\s*[0-9]+\s*;' src/OtaUpdater.h || true)
          if [ "$decls" -ne 1 ]; then
            echo "::error::expected exactly one FW_VERSION declaration, found $decls"
            exit 1
          fi
          want=$(grep -oP '^\s*constexpr\s+int\s+FW_VERSION\s*=\s*\K[0-9]+' src/OtaUpdater.h)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/version.txt"
          if ! got=$(curl -fsSL "$url"); then
            echo "::error::$url did not answer. Refusing to promote a release whose"
            echo "::error::version.txt cannot be read."
            exit 1
          fi
          got=$(printf '%s' "$got" | tr -d '[:space:]')
          echo "tagged FW_VERSION=$want  $url=$got"
          if [ "$got" != "$want" ]; then
            echo "::error::version.txt on $tag reads '$got' but the tagged source says $want."
            echo "::error::Refusing to promote."
            exit 1
          fi
      - name: Promote this release to latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          # `--prerelease=false` is the switch; `--latest` was measured inert.
          # The four-row isolation is recorded on the demote step in `version`.
          gh release edit "$tag" --prerelease=false
      - name: Report the result
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.event.release.tag_name }}" --json isPrerelease
