name: device-ids

# NO PATH FILTER, DELIBERATELY.
#
# workers.yml is filtered to proxy/** and dashboard/**, which is right for a test
# suite and wrong for this. Every real device id found on 2026-08-31 was in a
# DOC or a test fixture, and the one that mattered -- somebody else's board -- was
# added by a docs-only PR that no filtered workflow would have run. A guard whose
# trigger excludes the place the problem lives is not a guard.
on:
  push:
    branches: [main]
  pull_request:

# A newer PR head cancels this workflow's run for its older head; nothing else is ever cancelled (docs/ci-concurrency.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  no-real-device-ids:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the coordinate gate's --diff HEAD^1 has its base: on a pull_request run HEAD is the merge
          # commit and HEAD^1 the base branch tip; on a push, HEAD^1 is the previous main. Every other step reads HEAD.
          # A push of SEVERAL commits is diffed against its last parent only, so --diff alone would miss a coordinate
          # added in an earlier commit of that push. The whole-tree ratchet (a count above the baseline fails) is what
          # catches it: keep that refusal, it is not redundant with --diff.
          fetch-depth: 2
      # No committed file names the bench network: a network name in an association or ssid context, a
      # BSSID, a private LAN address (docs/wifi-scrub.md; it absorbed check_bssid.py). And the recorders'
      # two redaction implementations agree. pwsh is on the ubuntu image.
      - run: python3 scripts/check_wifi.py
      - run: python3 scripts/check_wifi.py --selftest
      # Each code sabotage, an in-memory edit of check_wifi.py, must turn exactly its registered rows red, and a stale anchor
      # fails here: #558 left S-W5J's stale, and nothing ran this to say so. S-W3, S-W7 and W8 read real values from
      # BASE and CI logs are public, so they stay local (docs/weatherscope-stage3.md A12.164).
      - run: python3 scripts/check_wifi_sabotage.py --code-only
      # What check_wifi.py EXCUSES, read (docs/weatherscope-stage3.md A12.113): every binary it cannot decode has its
      # strings scanned under check_wifi.py's own patterns plus a user-directory path, and its photos' EXIF and XMP
      # checked for location. Fonts are third-party and allowed by hash. The selftest plants into real copies first.
      - run: python3 scripts/check_binary_strings.py --selftest
      # Each sabotage, planted into a copy of the script, must turn exactly its frozen rows red (A12.116).
      - run: python3 scripts/check_binary_strings.py --sabotage
      - run: python3 scripts/check_binary_strings.py
      - run: python3 scripts/check_redaction_vectors.py
      - run: python3 scripts/check_redaction_vectors.py --selftest
      # Full history is NOT needed and is not wanted: this scans the tree at
      # HEAD. Two commits pushed on 2026-08-31 carry a real id and were
      # deliberately left alone rather than rewritten -- a history-wide scan
      # would be permanently red, and a control that can never pass is a control
      # somebody disables. See scripts/check_device_ids.py.
      - run: python3 scripts/check_device_ids.py
      # No new coordinate near Bend past 2 dp, and the tree's count of them only falls (scripts/check_precise_coords.py,
      # the owner's rule of 2026-11-13; clock times and .step/.stp are the ruled exemptions, 2026-11-14). The selftest's
      # rows use values generated at run time, each sabotage must turn exactly its rows red, then the tree against its
      # baseline and every line added since HEAD^1. Findings print as path:line only.
      - run: python3 scripts/check_precise_coords.py --selftest
      - run: python3 scripts/check_precise_coords.py --sabotage
      - run: python3 scripts/check_precise_coords.py --diff HEAD^1
      # The routes-refresh workflow keeps the owner's conditions (scripts/check_routes_workflow.py, W10): SC1 no PR or
      # fork trigger and no other workflow on its environment, SC3 nothing echoes a secret, SC5 only ROUTES_* secrets,
      # PIN1 every action by full sha, NPM1 only npm ci. The selftest plants each, and each sabotage turns its own green.
      - run: python3 scripts/check_routes_workflow.py
      - run: python3 scripts/check_routes_workflow.py --selftest
      # No committed file names a board's MAC, whole or by its device name (scripts/check_macs.py; it needs no registry).
      # The selftest plants one twin of each form, and each sabotage must turn exactly its rows red.
      - run: python3 scripts/check_macs.py
      - run: python3 scripts/check_macs.py --selftest
      - run: python3 scripts/check_macs.py --sabotage
      # The frame bench's step-C exemption (BLIPSCOPE_MAP_REFUSAL_BENCH_EXEMPT) lives on bench/frame-bench-c1 ONLY: a PR
      # carrying it would disarm the step-C refusal in src/AircraftManager.h (docs/frame-time-bench.md, "C1's bench").
      # The selftest plants each form it can take, and the refusal's own absence.
      - run: python3 scripts/check_no_bench_exemption.py
      - run: python3 scripts/check_no_bench_exemption.py --selftest
      # Session claims (docs/session-claims.md): CL1-CL12, then each plant must turn exactly its rows red.
      - run: python3 scripts/session-claim.py --selftest
      - run: python3 scripts/session-claim.py --sabotage
      # The ingest deploy path (docs/wx-ingest-deploy.md): ID1-ID13 against a fake npx in a mirror tree, then each plant
      # must turn exactly its rows red. IDs-a is the ruled one: without the claim check, the deploy runs without the claim.
      - run: bash tools/wx/check_ingest_deploy.sh
      - run: bash tools/wx/check_ingest_deploy.sh --sabotage
      # The commit pin (docs/deploy-sha-pin.md): deploy.sh refuses any commit but the plan's (EXPECT_SHA), and deploys past
      # main only for the commits the plan names (ALLOW_BEHIND_SHAS), in a mirror git repo with a fake wrangler; DC1 proves
      # the dirty-tree guard still fires; then each plant must turn exactly its row red.
      - run: bash proxy/scripts/check-deploy-sha.sh
      - run: bash proxy/scripts/check-deploy-sha.sh --sabotage
      # C1 (docs/ci-concurrency.md): every PR workflow cancels its own superseded runs, and nothing else.
      - run: python3 scripts/check_workflow_concurrency.py
      - run: python3 scripts/check_workflow_concurrency.py --selftest
      # F1 (docs/wx-opera-code-stage.md): the firmware asks /wx for "cref" only and WxEnabled() reads no location, so
      # which OPERA product answers is the server's choice alone. The sabotage plants a second product and a latitude test.
      - run: python3 scripts/check_wx_device_cref.py
      - run: python3 scripts/check_wx_device_cref.py --sabotage
      # The token-file readers (docs/token-file-python.md): the helper's T1-T10 (T4, the POSIX permission refusal,
      # runs here on Linux), each plant turning exactly its control red, then the guard's plant, then the guard: no
      # tracked .py opens the token file directly, so every reader goes through BLIPSCOPE_TOKEN_FILE and its refusals.
      - run: python3 tools/token_file.py --selftest
      - run: python3 tools/token_file_sabotage.py
      - run: python3 scripts/check_token_file_readers.py --selftest
      - run: python3 scripts/check_token_file_readers.py
      # PD6's fleet instrument (docs/wx-opuk.md, the 2026-11-24 re-grade): its real queries run in SQLite over planted
      # rows, and one point of each of the seven families in this dataset must leave every fleet count unchanged.
      - run: python3 tools/wx/pd6_fleet.py --selftest
      # D4's V6 reader (docs/basemap-v6.md), in PD6's form: its selftest over planted rows, with the network blocked inside it.
      # The step asserts from the selftest's own output, not from its exit alone: ST0 (the block fires on its own control) and
      # ST10 (no network attempt after it) as exact lines, then the pass line. Under the runner's `bash -e` the exit status is
      # captured first and the whole output printed before any assertion.
      - run: |
          out="$RUNNER_TEMP/v6-selftest.out"; rc=0
          python3 -I tools/basemap/v6_fleet.py --selftest > "$out" 2>&1 || rc=$?
          cat "$out"; echo "v6_fleet.py --selftest exit $rc"
          [ "$rc" -eq 0 ] || { echo "V6 selftest: exit $rc"; exit 1; }
          grep -qx 'PASS ST0 the network block fires on its own control: attempts 1' "$out" || { echo "V6 selftest: ST0, the network block's own control, did not read attempts 1"; exit 1; }
          grep -qx 'PASS ST10 no network attempt after the control: attempts 0' "$out" || { echo "V6 selftest: ST10 did not read attempts 0"; exit 1; }
          grep -qx 'SELFTEST PASSED: 12 of 12 rows' "$out" || { echo "V6 selftest: no 'SELFTEST PASSED: 12 of 12 rows' line"; exit 1; }
      # ... and its red first: each plant, one exact edit in a temp copy, must fail exactly its registered selftest rows.
      - run: python3 -I tools/basemap/v6_fleet_sabotage.py
      # Every in-tree wrangler call goes through proxy/scripts/wrangler-run.mjs (docs/wrangler-run.md): the check, its
      # planted shapes, and the helper's own selftest against a stand-in wrangler (no network, no account).
      - run: python3 scripts/check_wrangler_calls.py --selftest
      - run: python3 scripts/check_wrangler_calls.py
      - run: node proxy/scripts/wrangler-run.mjs --selftest
      # The fresh-boot hands-on cadence (RELEASING.md step 0; docs/fresh-boot-automation.md): its five registered
      # controls on a synthetic repository. Only the selftest runs here: a real read needs the release tags, which this
      # job's shallow checkout does not fetch. scripts/fresh-boot-auto.sh runs the real read before every automated step 0.
      - run: python3 scripts/fresh-boot-cadence.py --selftest
      # The config form as the browser posts it (step 6, R0-R2, K-loc), and F7: a sentinel value reaches no output.
      - run: python3 scripts/fresh-boot-form.py --selftest
      # The owner's PC adapter, pinned to "Wi-Fi" (never its virtual copy "Wi-Fi 5"): the reader prints four facts and never
      # netsh's own text (a MAC, a network name); and step 2's exact-name parser (no prefix match).
      - run: python3 scripts/fresh-boot-wlan.py --selftest
      - run: pwsh -NoProfile -File scripts/fresh-boot-wifi-join.ps1 -SelfTest
      # The retired privacy sentence ("... and nothing that identifies your device", false, replaced 2026-11-17) stays out
      # of README.md and the support page (scripts/check_privacy_text.py). Here and not in the workers workflow, because
      # a README-only edit must run it too. Its controls prove it is reading each privacy section; the selftest plants
      # each row red in an in-memory copy.
      - run: python3 scripts/check_privacy_text.py --selftest
      - run: python3 scripts/check_privacy_text.py
      # P1 (docs/workflow-permissions.md): every workflow states its own GITHUB_TOKEN permissions, top level and per
      # job, exactly as registered, so the repository default can go to read without any workflow changing. Last in
      # this job, so a red here cannot hide the checks above it.
      - run: python3 scripts/check_workflow_permissions.py
      - run: python3 scripts/check_workflow_permissions.py --selftest
