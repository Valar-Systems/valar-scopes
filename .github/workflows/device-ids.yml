name: device-ids

# NO PATH FILTER, DELIBERATELY.
#
# workers.yml is filtered to proxy/** and dashboard/**, which is right for a test
# suite and wrong for this. Every real device id found on 2026-08-31 was in a
# DOC or a test fixture, and the one that mattered -- somebody else's board -- was
# added by a docs-only PR that no filtered workflow would have run. A guard whose
# trigger excludes the place the problem lives is not a guard.
on:
  push:
    branches: [main]
  pull_request:

# A newer PR head cancels this workflow's run for its older head; nothing else is ever cancelled (docs/ci-concurrency.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-real-device-ids:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No committed file names the bench network: a network name in an association or ssid context, a
      # BSSID, a private LAN address (docs/wifi-scrub.md; it absorbed check_bssid.py). And the recorders'
      # two redaction implementations agree. pwsh is on the ubuntu image.
      - run: python3 scripts/check_wifi.py
      - run: python3 scripts/check_wifi.py --selftest
      # Each code sabotage, an in-memory edit of check_wifi.py, must turn exactly its registered rows red, and a stale anchor
      # fails here: #558 left S-W5J's stale, and nothing ran this to say so. S-W3, S-W7 and W8 read real values from
      # BASE and CI logs are public, so they stay local (docs/weatherscope-stage3.md A12.164).
      - run: python3 scripts/check_wifi_sabotage.py --code-only
      # What check_wifi.py EXCUSES, read (docs/weatherscope-stage3.md A12.113): every binary it cannot decode has its
      # strings scanned under check_wifi.py's own patterns plus a user-directory path, and its photos' EXIF and XMP
      # checked for location. Fonts are third-party and allowed by hash. The selftest plants into real copies first.
      - run: python3 scripts/check_binary_strings.py --selftest
      # Each sabotage, planted into a copy of the script, must turn exactly its frozen rows red (A12.116).
      - run: python3 scripts/check_binary_strings.py --sabotage
      - run: python3 scripts/check_binary_strings.py
      - run: python3 scripts/check_redaction_vectors.py
      - run: python3 scripts/check_redaction_vectors.py --selftest
      # Full history is NOT needed and is not wanted: this scans the tree at
      # HEAD. Two commits pushed on 2026-08-31 carry a real id and were
      # deliberately left alone rather than rewritten -- a history-wide scan
      # would be permanently red, and a control that can never pass is a control
      # somebody disables. See scripts/check_device_ids.py.
      - run: python3 scripts/check_device_ids.py
      # No committed file names a board's MAC, whole or by its device name (scripts/check_macs.py; it needs no registry).
      # The selftest plants one twin of each form, and each sabotage must turn exactly its rows red.
      - run: python3 scripts/check_macs.py
      - run: python3 scripts/check_macs.py --selftest
      - run: python3 scripts/check_macs.py --sabotage
      # Session claims (docs/session-claims.md): CL1-CL12, then each plant must turn exactly its rows red.
      - run: python3 scripts/session-claim.py --selftest
      - run: python3 scripts/session-claim.py --sabotage
      # The ingest deploy path (docs/wx-ingest-deploy.md): ID1-ID13 against a fake npx in a mirror tree, then each plant
      # must turn exactly its rows red. IDs-a is the ruled one: without the claim check, the deploy runs without the claim.
      - run: bash tools/wx/check_ingest_deploy.sh
      - run: bash tools/wx/check_ingest_deploy.sh --sabotage
      # C1 (docs/ci-concurrency.md): every PR workflow cancels its own superseded runs, and nothing else.
      - run: python3 scripts/check_workflow_concurrency.py
      - run: python3 scripts/check_workflow_concurrency.py --selftest
      # F1 (docs/wx-opera-code-stage.md): the firmware asks /wx for "cref" only and WxEnabled() reads no location, so
      # which OPERA product answers is the server's choice alone. The sabotage plants a second product and a latitude test.
      - run: python3 scripts/check_wx_device_cref.py
      - run: python3 scripts/check_wx_device_cref.py --sabotage
      # The token-file readers (docs/token-file-python.md): the helper's T1-T10 (T4, the POSIX permission refusal,
      # runs here on Linux), each plant turning exactly its control red, then the guard's plant, then the guard: no
      # tracked .py opens the token file directly, so every reader goes through BLIPSCOPE_TOKEN_FILE and its refusals.
      - run: python3 tools/token_file.py --selftest
      - run: python3 tools/token_file_sabotage.py
      - run: python3 scripts/check_token_file_readers.py --selftest
      - run: python3 scripts/check_token_file_readers.py
      # The fresh-boot hands-on cadence (RELEASING.md step 0; docs/fresh-boot-automation.md): its five registered
      # controls on a synthetic repository. Only the selftest runs here: a real read needs the release tags, which this
      # job's shallow checkout does not fetch. scripts/fresh-boot-auto.sh runs the real read before every automated step 0.
      - run: python3 scripts/fresh-boot-cadence.py --selftest
      # The config form as the browser posts it (step 6, R0-R2, K-loc), and F7: a sentinel value reaches no output.
      - run: python3 scripts/fresh-boot-form.py --selftest
