# Print cards: do they still fit, at size, with everything on them?
#
# The cards are 4x6in with overflow:hidden, so copy that does not fit is not
# wrong on screen -- it is ABSENT from the printed card. On main until 2026-09-24
# the quickstart card's back-face note ran 12.7px past the card edge and its
# second line never printed; scripts/check-print-cards.mjs said FAIL the whole
# time, but nothing ran it. This job runs it.
#
# FAILS WHEN a card is not exactly 4x6in, any text escapes its card, a file
# prints to a different number of PDF pages than it has cards, or a required
# element (wordmark, QR, the data note) is missing or off its card. The selftest
# runs first and plants each of those failures, so a green check is one that
# was shown able to go red on this runner.
#
# The rendered PDFs are uploaded on every run (the `print-cards-pdf` artifact):
# the letter-sheet harnesses for printing at home at 100%, and 4x6in pages for a
# print shop.
name: print-cards

on:
  push:
    paths:
      - "docs/*card*.html"
      - "scripts/check-print-cards.mjs"
      - ".github/workflows/print-cards.yml"
  pull_request:
    paths:
      - "docs/*card*.html"
      - "scripts/check-print-cards.mjs"
      - ".github/workflows/print-cards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The checker FINDS a browser and exits 2 (rig broken) without one; this
      # just makes the absence visible in its own step rather than inside a FAIL.
      - name: Browser present?
        run: |
          if command -v google-chrome >/dev/null; then google-chrome --version; else echo "google-chrome: absent"; exit 2; fi

      - name: Selftest (every failure mode is planted and must be caught)
        run: node scripts/check-print-cards.mjs --selftest

      - name: Check the cards and render PDFs
        run: node scripts/check-print-cards.mjs --pdf-out print-cards-pdf

      - name: Upload the PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-cards-pdf
          path: print-cards-pdf/
          if-no-files-found: warn
