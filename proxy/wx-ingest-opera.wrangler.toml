# The OPERA ingests, one Worker per product (docs/wx-opera-code-stage.md §1d; Q-WORKERS, ruled 2026-11-06 ~17:08Z). This
# file replaced wx-ingest-opuk.wrangler.toml, and opuk keeps that Worker, blipscope-wx-ingest-opuk. Each Worker is built
# from this package beside the proxy and the cref ingest (wx-ingest.wrangler.toml); none has a route or a public surface.
# Its only entry is its cron, and it writes its own product's frames to the bucket the proxy reads.
#
#   npx wrangler deploy -c wx-ingest-opera.wrangler.toml -e <id>          # ingesting: PRODUCT <id>, WX_INGEST "on"
#   npx wrangler deploy -c wx-ingest-opera.wrangler.toml -e <id>-inert    # the stop: the cron KEPT, WX_INGEST "off"
#
# THE TOP LEVEL IS INERT and names no product's Worker. A deploy without -e would create blipscope-wx-ingest-opera, with
# no cron and WX_INGEST "off": it builds nothing and replaces no product's ingest. (Before this file, a deploy without
# -e WAS opuk's ingest; that command now finds no file.)
#
# The stop is a version change, which takes effect at once; removing a cron would take up to 15 minutes to propagate
# (Cloudflare's docs; measured 323-336 s on the dev copy). Bindings and vars do not inherit, so every env repeats them;
# scripts/check-wx-plant.mjs reads all 21 targets' bindings from their dry-runs (FB2), and FX
# (test/wx-ingest-split.test.ts) reads this text.
#
# cpu_ms: opuk's single-build max 3,123 ms (Plan S, S4) x2 for a backfill invocation, x1.6 for the runtime's spread on
# identical work = 9,994 -> 12,000, under the documented 30,000 cap for a sub-hourly Cron Trigger. Stage 1c's builds
# and the M stage's run far under it (docs/wx-opera-map-r2.md, docs/wx-opera-dev-measure.md).
name = "blipscope-wx-ingest-opera"
main = "src/wx/ingest-opera-worker.ts"
compatibility_date = "2025-12-01"   # the cref ingest's date
account_id = "48822e896bb10c45aa6bfe139bcff3d1"
workers_dev = false

[triggers]
crons = []

[limits]
cpu_ms = 12000

[observability]
enabled = true
head_sampling_rate = 1

[vars]
WX_INGEST = "off"

[[r2_buckets]]
binding = "WX"
bucket_name = "blipscope-wx"

# opuk: isles.
[env.opuk]
name = "blipscope-wx-ingest-opuk"
workers_dev = false
[env.opuk.triggers]
crons = ["* * * * *"]
[env.opuk.limits]
cpu_ms = 12000
[env.opuk.observability]
enabled = true
head_sampling_rate = 1
[env.opuk.vars]
PRODUCT = "opuk"
WX_INGEST = "on"
[[env.opuk.r2_buckets]]
binding = "WX"
bucket_name = "blipscope-wx"

[env.opuk-inert]
name = "blipscope-wx-ingest-opuk"
workers_dev = false
[env.opuk-inert.triggers]
crons = ["* * * * *"]
[env.opuk-inert.limits]
