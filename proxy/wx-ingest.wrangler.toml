# blipscope-wx-ingest -- the weather ingest Worker (docs/wx-server.md). A SECOND Worker built from this
# package: same node_modules, same tests, same CI job as the proxy.
#
# NOT DEPLOYED. The bucket below does not exist yet: Daniel creates it, and deploys this with
#   npx wrangler deploy -c wx-ingest.wrangler.toml
# It has no route and no public surface; its only entry is the cron. The proxy reads its frames
# through its own WX binding (wrangler.toml), and never writes them.
name = "blipscope-wx-ingest"
main = "src/wx/ingest-worker.ts"
compatibility_date = "2025-12-01"   # the proxy's date
account_id = "48822e896bb10c45aa6bfe139bcff3d1"
workers_dev = false

# (a'): every minute, plus a second check 30 s in, inside the same invocation (ingest-worker.ts).
[triggers]
crons = ["* * * * *"]

# cref only since the opuk split (docs/wx-opuk-split.md): opuk has its own Worker, wx-ingest-opuk.wrangler.toml.
# cref's single-build max 3,621 ms (production, 2026-11-04), x2 for a backfill invocation, x1.6 for the runtime's
# spread on identical work = 11,587 -> 12,000. The old 5,000 (10x A4's 0.53 s) sat below a measured two-build cref
# backfill (5,733 ms). Under the documented 30,000 cap for a sub-hourly Cron Trigger. The PROXY's cpu_ms = 200 is
# untouched: the ingest never runs inside the proxy (A7 ruling).
[limits]
cpu_ms = 12000

[observability]
enabled = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "WX"
bucket_name = "blipscope-wx"
