# blipscope-wx-ingest -- the weather ingest Worker (docs/wx-server.md). A SECOND Worker built from this
# package: same node_modules, same tests, same CI job as the proxy.
#
# NOT DEPLOYED. The bucket below does not exist yet: Daniel creates it, and deploys this with
#   npx wrangler deploy -c wx-ingest.wrangler.toml
# It has no route and no public surface; its only entry is the cron. The proxy reads its frames
# through its own WX binding (wrangler.toml), and never writes them.
name = "blipscope-wx-ingest"
main = "src/wx/ingest-worker.ts"
compatibility_date = "2025-12-01"   # the proxy's date
account_id = "48822e896bb10c45aa6bfe139bcff3d1"
workers_dev = false

# (a'): every minute, plus a second check 30 s in, inside the same invocation (ingest-worker.ts).
[triggers]
crons = ["* * * * *"]

# cref only since the opuk split (docs/wx-opuk-split.md): opuk has its own Worker, wx-ingest-opuk.wrangler.toml.
# cref's single-build max 3,621 ms (production, 2026-11-04), x2 for a backfill invocation, x1.6 for the runtime's
# spread on identical work = 11,587 -> 12,000. The old 5,000 (10x A4's 0.53 s) sat below a measured two-build cref
# backfill (5,733 ms). Under the documented 30,000 cap for a sub-hourly Cron Trigger. The PROXY's cpu_ms = 200 is
# untouched: the ingest never runs inside the proxy (A7 ruling).
[limits]
cpu_ms = 12000

[observability]
enabled = true
head_sampling_rate = 1

[[r2_buckets]]
binding = "WX"
bucket_name = "blipscope-wx"

# W4 (docs/weatherscope-stage4.md S4.12.3, S4.25): MRMS SeamlessHSR, Weatherscope's US radar, on a Worker of its own,
# blipscope-wx-ingest-shsr, so its build never shares an invocation's CPU with cref's. Deployed only through
# tools/wx/ingest_deploy.sh wx-ingest.wrangler.toml <env>, under the claim wx-ingest-shsr:production; [env.shsr-inert]
# (the same Worker, ingest off) goes first, because a new Worker has nothing to roll back to. A deploy that forgets the
# env reaches cref's top-level Worker, whose claim (wx-ingest:production) the shsr claim does not cover, so it is refused.
# `name` is set in both envs: without it, wrangler would name the inert one blipscope-wx-ingest-shsr-inert. vars and
# r2_buckets do not inherit, so each env carries its own.
[env.shsr]
name = "blipscope-wx-ingest-shsr"
main = "src/wx/ingest-mrms-worker.ts"
workers_dev = false

[env.shsr.triggers]
crons = ["* * * * *"]

[env.shsr.limits]
cpu_ms = 12000

[env.shsr.observability]
enabled = true
head_sampling_rate = 1

[env.shsr.vars]
PRODUCT = "shsr"
WX_INGEST = "on"

[[env.shsr.r2_buckets]]
binding = "WX"
bucket_name = "blipscope-wx"

[env.shsr-inert]
name = "blipscope-wx-ingest-shsr"
main = "src/wx/ingest-mrms-worker.ts"
workers_dev = false

[env.shsr-inert.triggers]
crons = ["* * * * *"]

[env.shsr-inert.limits]
cpu_ms = 12000

[env.shsr-inert.observability]
enabled = true
head_sampling_rate = 1

[env.shsr-inert.vars]
PRODUCT = "shsr"
WX_INGEST = "off"

[[env.shsr-inert.r2_buckets]]
binding = "WX"
bucket_name = "blipscope-wx"
