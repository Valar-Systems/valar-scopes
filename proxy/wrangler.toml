# Blipscope proxy -- Cloudflare Worker.
#
# The TOP-LEVEL config is what `wrangler dev` and the vitest-pool-workers tests
# read: it carries every binding the code needs but NO rate-limit bindings
# (those are an "unsafe" beta binding miniflare can't emulate; the code treats
# them as optional). Deploys always target an environment:
#
#   npx wrangler deploy --env staging
#
# Secrets (per environment, never in this file):
#   npx wrangler secret put DEVICE_KEY_SECRET --env staging # HMAC secret; the ONLY auth path
#   npx wrangler secret put RELAY_KEY --env staging          # X-Relay-Key -> our egress relay (see relay/)
#   npx wrangler secret put ADSB_LOL_API_KEY --env staging   # optional, if adsb.lol ever issues feeder keys
#
# Upstream base URLs are per-env VARS (below), not secrets -- they are the relay
# hostnames (relay-a/relay-b.valarsystems.com), which are public DNS.

name = "blipscope-proxy"
main = "src/index.ts"
compatibility_date = "2025-12-01"

# Build identifier surfaced on /healthz. This default is what `wrangler dev` and
# the test runner see; scripts/deploy.sh overrides it with the real commit SHA at
# deploy time (--define). The nested quotes are required -- the value is
# substituted into the bundle verbatim, so it has to be a JS string literal.
#
# A deployment reporting "dev" therefore did NOT come from the deploy script, and
# that is the point: it is the one state that cannot be explained away later.
define = { BUILD_COMMIT = "\"dev\"" }

# Pin the account explicitly. Without this wrangler calls /memberships to work out
# which account to target, which needs a User->User Details->Read permission the CI
# token deliberately does NOT have -- that token is scoped to Workers KV Storage:
# Edit and nothing else. Naming the account here keeps the token minimal instead of
# widening a write credential just so it can look up its own owner. It also pins
# deploys to one account, so a second account on this login can never receive them.
# An account ID is an identifier, not a credential: it grants nothing without a token.
account_id = "48822e896bb10c45aa6bfe139bcff3d1"

[vars]
# NB: no UPSTREAM_ADSB_LOL_BASE here -- top-level config is what tests/dev use, and
# they must fall back to api.adsb.lol direct. The relay URLs live per-env below.
UPSTREAM_ADSB_FI_ENABLED = "false"        # dev/test only -- staging + production below set "true" (adsb.fi is the chain primary)
UPSTREAM_AIRPLANES_LIVE_ENABLED = "false" # DEAD no-op: airplanes.live is prohibited by operator (hardcoded off)
ROUTE_ADSBDB_ENABLED = "true"             # route fallback; "false" once adsb.lol routeset recovers

[[kv_namespaces]]
binding = "ENRICH_KV"
id = "0000000000000000000000000000dev0" # placeholder: tests/dev run in-memory; real ids live per-env

[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "blipscope_proxy"

# ===================== staging =====================
# scopes-staging.valarsystems.com (production will be scopes.valarsystems.com).
# Bindings are NOT inherited across environments, so everything is redeclared here.
[env.staging]
name = "blipscope-proxy-staging"
# workers.dev disabled: the account has no workers.dev subdomain registered
# (a one-time interactive dashboard step); the custom domain below is canonical.
workers_dev = false

routes = [
  { pattern = "scopes-staging.valarsystems.com", custom_domain = true }
]

# NOT INHERITED from the top level -- `define` behaves like the bindings above, so
# an env that omits it ships a bundle where BUILD_COMMIT is an undeclared
# identifier and /healthz throws ReferenceError. Caught by a --dry-run grep, which
# is the only reason it is written down here.
[env.staging.define]
BUILD_COMMIT = "\"dev\""

[env.staging.vars]
# Turnstile sitekey for the device-enrolment page (see src/enrollpage.ts).
#
# A VAR, NOT A SECRET, and the distinction is not cosmetic: the sitekey is
# rendered into the page's HTML, so it is public by construction. Putting it in
# the reviewed diff means the value that gates enrolment on this environment is
# something a person can look at, next to the domain it is scoped to.
#
# SEPARATE WIDGETS PER ENVIRONMENT, each with its own secret. One widget across
# both would make a token solved on staging verifiable at production, because
# handleEnroll records solve.hostname and deliberately does not enforce it.
# Widget: blipscope-enroll-staging, domains ["scopes-staging.valarsystems.com"].
# Pairs with the TURNSTILE_SECRET_KEY secret on this env; without that secret the
# endpoint answers 503 not_configured and mints nothing.
TURNSTILE_SITEKEY = "0x4AAAAAAEOTguN4gjbUcmlJ"

# Missileer origin -- the valar-eam-feed Render service that /missileer/* and
# /api/v1/missileer/* are proxied to (see src/missileer.ts).
#
# A VAR, NOT A SECRET: the value is a public hostname, and having it visible in
# the diff is the point -- a routing target that changes silently is a routing
# target nobody can review.
#
# ENABLED 2026-08-05 -- the deliberate 503 -> live-proxy flip deferred from the
# metrics PR. Preconditions checked before flipping: enrollment closed,
# DATABASE_URL wired, game API healthy at the origin.
MISSILEER_ORIGIN = "https://valar-eam-feed.onrender.com"
#
# adsb.lol reached via the DEDICATED-EGRESS RELAYS (see relay/). relay-a primary,
# relay-b secondary -> HA through the failover chain. Requires the RELAY_KEY
# secret set on this env (npx wrangler secret put RELAY_KEY --env staging).
UPSTREAM_ADSB_LOL_BASE = "https://relay-a.valarsystems.com"
UPSTREAM_ADSB_LOL_BASE_B = "https://relay-b.valarsystems.com"
# adsb.fi ENABLED ON STAGING 2026-07-30 -- written caching/redistribution permission.
# This is the soak ahead of the production cutover: staging runs the real shipping
# order (adsb.fi primary -> adsb.lol fallback) for a day before production follows.
# The /fi path prefix is the relay's adsb.fi upstream; /fi50 is the separate slow-TTL
# experiment path and is deliberately NOT used here -- staging must run the same TTL
# production will, or the soak validates a config we aren't shipping.
UPSTREAM_ADSB_FI_ENABLED = "true"
# FRESHNESS A/B ENDED 2026-08-08 -- staging is back on /fi, the path production runs.
# The relay still serves the SAME adsb.fi upstream at three tile TTLs, so the
# experiment can be re-run by moving this pair alone:
#   /fi     8 s -- THE SHIPPING CONFIG, and what staging must therefore soak
#   /fi25  25 s -- what two sanctioned IPs would buy at 50-board scale
#   /fi50  50 s -- what ONE IP would force; rejected on staleness
# STAGING MUST RUN THE PATH PRODUCTION RUNS. While this sat on /fi50 the only Worker
# traffic either relay saw was a 50 s-TTL soak, so the pre-pilot numbers described a
# config we were not shipping -- and production's own /fi path saw no Worker traffic at
# all. Re-point this in the same change as any production TTL move, never separately.
UPSTREAM_ADSB_FI_BASE = "https://relay-a.valarsystems.com/fi"
UPSTREAM_ADSB_FI_BASE_B = "https://relay-b.valarsystems.com/fi"
# Tracks the relay tile TTL, which moves 8s -> 30s for the pilot: N >= 2 x TTL + 25 s.
# Set in BOTH env blocks together and deployed BEFORE the boxes are re-run, or every
# fetch looks degraded and the chain walks all feeds on every request.
BLIPS_FEED_MAX_AGE_MS = "85000"
# airplanes.live is PROHIBITED by operator (written refusal) and hardcoded off in
# code -- this var is a dead no-op. See "Upstream licensing posture" in README.md.
UPSTREAM_AIRPLANES_LIVE_ENABLED = "false"
# adsbdb is OFF here so the route canaries can FAIL. With the fallback enabled a
# resolved callsign proves nothing -- it is equally consistent with our mirror
# answering, adsbdb answering, and a leftover 24 h cache entry answering. Off, a
# canary that resolves can only have come from the rt: mirror, which is the
# falsifiable version of the same check. Production follows at cutover.
ROUTE_ADSBDB_ENABLED = "false"

# Full request logs on staging (low traffic). Production should sample --
# ~200 B/request of JSON at fleet scale is real Workers Logs money; see the
# README cost model. head_sampling_rate 0.05 keeps 1-in-20.
[env.staging.observability]
enabled = true
head_sampling_rate = 1

[[env.staging.kv_namespaces]]
binding = "ENRICH_KV"
id = "8b6e92ed802a4192b6b6c1399fdf96aa"

[[env.staging.analytics_engine_datasets]]
binding = "METRICS"
dataset = "blipscope_proxy_staging"

# Workers Rate Limiting binding (per-colo token buckets, 60 s period).
# RL_IP: a household NATs 1-3 devices behind one IP; the fastest tier polls every
# 2 s (30 rpm) + enrich taps, so 120 rpm covers 3 fast devices with margin.
# RL_KEY: fleet-wide abuse ceiling per colo (v1 ships ONE shared build key).
[[env.staging.unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 120, period = 60 }

[[env.staging.unsafe.bindings]]
name = "RL_KEY"
type = "ratelimit"
namespace_id = "1102"
simple = { limit = 6000, period = 60 }

# ===================== production =====================
# scopes.valarsystems.com. Mirrors staging, with the launch-correct posture:
# failover feeds OFF until their commercial-use permission clears (README/ROADMAP
# licensing to-do), and sampled request logging (full logging is real money at
# fleet scale -- see the cost model).
#
# BEFORE FIRST DEPLOY, three account-specific steps (see proxy/README.md
# "Going to production"):
#   1. Create the prod KV namespace and paste its id below (replace the
#      REPLACE_ME placeholder): npx wrangler kv namespace create ENRICH_KV --env production
#   2. Set the secrets: npx wrangler secret put DEVICE_KEY_SECRET --env production
#      REQUIRED -- per-device keys are the only auth path since 2026-08-13, so a
#      missing secret 401s the whole fleet. scripts/deploy.sh refuses without it.
#   3. Add scopes.valarsystems.com as a custom domain (route below; the zone must
#      be on this Cloudflare account).
# The RL binding namespace_ids (2101/2102) are distinct from staging's so the
# token buckets don't collide.
[env.production]
name = "blipscope-proxy"
workers_dev = false

routes = [
  { pattern = "scopes.valarsystems.com", custom_domain = true }
]

# adsb.lol via the DEDICATED-EGRESS RELAYS is the whole upstream story at launch.
# The relays (dedicated IPs) are what make adsb.lol-only viable: they end the
# Cloudflare shared-egress 429 that starved the picture to STALE. relay-a primary,
# relay-b secondary -> HA through the failover chain.
#
# CUTOVER (do AFTER staging verify -- see README verification sequence):
#   1. npx wrangler secret put RELAY_KEY --env production
#   2. npx wrangler deploy --env production   <- this deploy IS the cutover
# See the staging note: `define` is not inherited, and omitting it here would ship
# a production bundle whose /healthz throws.
[env.production.define]
BUILD_COMMIT = "\"dev\""

[env.production.vars]
# Turnstile sitekey for the device-enrolment page. Public by construction (it is
# rendered into the page HTML) -- see the staging block above for why this is a
# var and why the two environments have SEPARATE widgets rather than one.
# Widget: blipscope-enroll-production, domains ["scopes.valarsystems.com"].
TURNSTILE_SITEKEY = "0x4AAAAAAEOTkOwCSqYha96b"

# Missileer origin -- valar-eam-feed on Render. See src/missileer.ts for why the
# Worker proxies rather than routes, and valar-eam-feed/docs/missileer-routing.md
# for the alternatives that were rejected.
#
# A VAR, NOT A SECRET: a public hostname. Visible in the diff on purpose -- a
# routing target that can change silently is one nobody can review.
#
# ENABLED 2026-08-05. Before this, every /missileer/* and /api/v1/missileer/*
# path answered 503 missileer_unconfigured.
MISSILEER_ORIGIN = "https://valar-eam-feed.onrender.com"

UPSTREAM_ADSB_LOL_BASE = "https://relay-a.valarsystems.com"
UPSTREAM_ADSB_LOL_BASE_B = "https://relay-b.valarsystems.com"
#   adsb.fi        -- caching/redistribution permission granted IN WRITING 2026-07-30.
#                     LIVE IN PRODUCTION 2026-07-31, as chain primary. The flag and the
#                     two base URLs move TOGETHER, never separately: an enabled feed
#                     with no base URL falls back to hitting adsb.fi DIRECT from
#                     Cloudflare's shared egress, which is what used to 403.
#                     Cut over ahead of the planned staging soak because adsb.lol had
#                     stopped serving positions outright -- a LAX tile returned
#                     upstream_unavailable and a rural one returned zero aircraft with
#                     X-Upstream=adsb_lol, i.e. the un-cacheable per-IP 429 throttle
#                     biting in production, not a quiet sky. adsb.lol stays in the
#                     chain below as the licensed (ODbL) fallback and stays sponsored
#                     regardless of chain position. Rollback is UPSTREAM_FEED_ORDER,
#                     no deploy required.
#   airplanes.live -- PROHIBITED by operator: written refusal ("do not use our
#                     data"), dated July 2026. Hardcoded off in airplanes_live.ts;
#                     the var below is a dead no-op. NOT a reserve option -- off the
#                     table, not undecided. See "Upstream licensing posture".
UPSTREAM_ADSB_FI_ENABLED = "true"
UPSTREAM_ADSB_FI_BASE   = "https://relay-a.valarsystems.com/fi"
UPSTREAM_ADSB_FI_BASE_B = "https://relay-b.valarsystems.com/fi"
UPSTREAM_AIRPLANES_LIVE_ENABLED = "false"
# CUTOVER 2026-08-26: adsbdb is OFF. Every route now comes from our own CC0
# mirror (619,103 rt: keys, rule rev 3), verified by full per-shard enumeration
# before this line changed.
#
# ROLLBACK IS THIS ONE VALUE. Set it back to "true" and deploy: the fallback
# code path is still present and unchanged, deliberately, so the mirror can soak
# under real customer traffic with a one-line escape hatch. Deleting the fallback
# code is a LATER change, once the soak has said something.
ROUTE_ADSBDB_ENABLED = "false"
# Tracks the relay tile TTL, which moves 8 s -> 30 s for the 50-board pilot. The rule is
# N >= 2 x TTL + 25 s (DEFAULT_FEED_MAX_AGE_MS in upstreams/chain.ts), so 30 s needs
# >= 85 s: the old 45 s default would mark every normal fetch degraded and walk the whole
# chain on every request.
#
# ORDER: raise this var and deploy FIRST, then raise CACHE_TTL on the boxes. Backwards
# is the failure above.
#
# WHY THE TTL MOVED. Upstream fetch rate is (distinct hot tiles) / TTL. Tiles are
# 0.05 deg, so ~50 scattered boards are ~50 distinct tiles, and adsb.fi allows 1 req/s
# PER IP with 4xx/429 counting toward it. At 8 s that is ~375 fetches/min against a
# 120/min two-IP budget -- 3x over. At 30 s it is ~100/min, inside the budget with ~17 %
# headroom. This only works because BOTH relays carry traffic (partitionOrder in
# upstreams/chain.ts); under pure failover the budget is one IP and the TTL would have
# to be 50 s. The device-side cost is covered by the stale-ladder floor -- see
# minStaleMs in config.ts and AircraftManager::IsDataStale.
BLIPS_FEED_MAX_AGE_MS = "85000"

# Runaway kill switch, NOT a performance target. CPU time excludes time waiting on
# I/O, so the real work here is JSON parse + nearest-N sort on the blips path;
# measured warm tiles are ~4 ms worker-side, so 200 ms is ~50x headroom. It exists
# to kill an infinite loop, not to shave milliseconds -- do not tune it tighter.
[env.production.limits]
cpu_ms = 200

# FULL logging during the pilot. A ~55-board fleet is ~250k req/day; at the old
# 1-in-20 an individual customer's requests were statistically invisible, which
# defeats the point of having logs when someone reports a problem. Revisit around
# a few hundred devices (see README "Request log sampling"), where the volume --
# not the debugging value -- starts to dominate.
[env.production.observability]
enabled = true
head_sampling_rate = 1.0

[[env.production.kv_namespaces]]
binding = "ENRICH_KV"
id = "733bf90056104f56be9492e62450a0bf"

[[env.production.analytics_engine_datasets]]
binding = "METRICS"
dataset = "blipscope_proxy"

# Same per-colo reasoning as staging (RL_IP: ~3 fast devices per household IP;
# RL_KEY: per-colo fleet ceiling). Distinct namespace_ids so prod and staging
# buckets are independent. Revisit RL_KEY once per-device keys spread the fleet
# across many buckets instead of one shared key.
[[env.production.unsafe.bindings]]
name = "RL_IP"
type = "ratelimit"
namespace_id = "2101"
simple = { limit = 120, period = 60 }

[[env.production.unsafe.bindings]]
name = "RL_KEY"
type = "ratelimit"
namespace_id = "2102"
simple = { limit = 6000, period = 60 }
