# The builder Worker, `blipscope-basemap` (docs/basemap-route.md §2.1, §9's D2; docs/basemap-deploy.md).
#
# It has NO route and no workers.dev address: the only way in is the proxy's BASEMAP service binding (D3, D4). It
# builds one BMPK package per normalised query over its own R2 binding, STORE, and never writes to it (MP2).
#
# Deployed ONLY by `scripts/deploy.sh --builder <staging|production>`, which runs the proxy's guards (a clean proxy/,
# a commit on the remote, not behind origin/main in proxy/) and stamps BUILD_COMMIT with the FULL 40-hex commit, by
# --define, exactly as the proxy is stamped (Q2 as ruled). A bare `npx wrangler deploy --config basemap.wrangler.toml`
# falls through to the "UNSTAMPED" default below, and that bundle refuses every build (MW18): an unstamped builder
# cannot put a commit nobody can check out into a package's PROVENANCE.
name = "blipscope-basemap"
main = "src/basemap/worker.ts"
compatibility_date = "2025-12-01"
account_id = "48822e896bb10c45aa6bfe139bcff3d1"
workers_dev = false

# The nested quotes are required: the value is substituted into the bundle verbatim, as a JS string literal.
define = { BUILD_COMMIT = "\"UNSTAMPED\"" }

# cpu_ms is 68000 in ALL THREE limits blocks (S3, which rides D4; the owner's ruling to raise it with D4, 2026-11-25). The basis,
# both labels carried, never one without the other:
#   - the registered verdict: "A3' BLIND (the two-clock control failed 12 of 13): C NOT CONCLUDED";
#   - the labelled reading, as read and NOT the registered verdict: the INVOCATION's cpuTimeMs on staging, max 22,655 ms (KJFK at
#     r 222, the 137-mile shape), an upper bound on the build's own CPU. 3 x 22,655 = 67,965 -> 68,000.
# The previous 14,530 (10 x MM3's 1,453 ms at Atlanta, r 222) predates the dense builder. The firmware caps the map at 100 miles
# (r <= 162), where 22 measured places peak at 11,365 ms; the margin covers the heavier r 222 shape the server still accepts
# (MAX_R_KM 222). A limit costs nothing by itself: only CPU used is billed. The owner asked that every build past 14,530 ms be
# counted, so that the insurance is seen when it is used; that count is its own change.
# The three blocks must hold the same value, since staging measures what ships (test/basemap-limits.test.ts).
[limits]
cpu_ms = 68000

[[r2_buckets]]
binding = "STORE"
bucket_name = "blipscope-basemap"

# ---- staging ----------------------------------------------------------------------------------------------------
# Bindings, `define` and `limits` are NOT inherited by an env, so each is repeated: an env that omitted `define`
# would ship a bundle where BUILD_COMMIT is an undeclared identifier.
[env.staging]
name = "blipscope-basemap-staging"
workers_dev = false

[env.staging.define]
BUILD_COMMIT = "\"UNSTAMPED\""

[env.staging.limits]
cpu_ms = 68000

# Workers Logs, STAGING ONLY (docs/basemap-build-reads.md): the builder's one line per build (BB1-BB3) is read from
# here. Without it the builder had no events at all (0 over MM4's 15 builds). Production is unchanged.
[env.staging.observability]
enabled = true
head_sampling_rate = 1

# Request (invocation) logs off, as on the proxy: the builder's own build line stays (D4's (B), 2026-11-18).
[env.staging.observability.logs]
invocation_logs = false

# The same, read-only store as production: there is one sealed store, and the builder never writes.
[[env.staging.r2_buckets]]
binding = "STORE"
bucket_name = "blipscope-basemap"

# ---- production -------------------------------------------------------------------------------------------------
[env.production]
name = "blipscope-basemap"
workers_dev = false

[env.production.define]
BUILD_COMMIT = "\"UNSTAMPED\""

[env.production.limits]
cpu_ms = 68000

# Workers Logs, PRODUCTION: written and switched OFF (the owner, 2026-11-18: D4 logs = A). Switch-on, his word only: true.
[env.production.observability]
enabled = false
head_sampling_rate = 1

[env.production.observability.logs]
invocation_logs = false

[[env.production.r2_buckets]]
binding = "STORE"
bucket_name = "blipscope-basemap"
