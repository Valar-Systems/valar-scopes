; ===================== HARDWARE TEST (S3 1.46B) =======================
; Minimal display/I2C bring-up probe -- NOT a product env, NOT in CI. Built to
; localise a "black screen while the app is provably healthy" fault: the panel
; RESET on this board is on a TCA9554 I2C expander (EXIO2), not a GPIO, so
; tft.init() returns 1 whether or not the panel ever left reset and the app has
; no way to report the difference. This walks I2C scan -> raw backlight ->
; expander pulse -> panel fills, printing each step.
;
;   pio run -e hwtest-s3-146 -t upload -t monitor
;
; ===================== Missileer game bench harness ====================
; Answers the three HARDWARE questions gating the game design
; (docs/missileer-game-design.md §13): deputy hold-gesture dropout rate, max
; simultaneous touch points, and NTP sync uncertainty (which sets the deviation
; leaderboard's scoring granularity). Bench-only: no CI row, publishes nothing,
; makes no cloud calls.
;
; Inherits the SKU's board config from env:blipscope-s3-128 rather than restating
; it, so pins, PSRAM, flash and the big-NVS partition table can never drift from
; the product. build_src_filter is the exception -- it drops everything and
; re-includes only the harness TU, because gametest_main.cpp defines its own
; setup()/loop() and would otherwise collide with main.cpp.
;
; Flash with the port PINNED. A second board is usually attached (the soak), and
; auto-detection has already put an image on the wrong one once:
;   pio run -e gametest-s3-128 -t upload --upload-port COM119 -t monitor
[env:gametest-s3-128]
extends = env:blipscope-s3-128
build_src_filter = -<*> +<gametest_main.cpp>
lib_deps = lovyan03/LovyanGFX @ 1.2.21
;
; Compiles ONE translation unit (src/hwtest_main.cpp); the whole app, every
; edition, and all lib_deps beyond LovyanGFX are excluded so nothing else can
; touch the bus or the heap during the test.
[env:hwtest-s3-146]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = -<*> +<hwtest_main.cpp> +<board/board_s3_touch146.cpp> +<board/Touch_SPD2010.cpp> +<board/Panel_SPD2010.cpp>
lib_deps = lovyan03/LovyanGFX @ 1.2.21
build_flags =
    ${common.build_flags}
    -DBLIPSCOPE_VARIANT_S3_146
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ===================== Missileer flight-animation rig ==================
; Bench harness for iterating the launch animation on real glass, ahead of the
; game loop consuming it. src/animtest_main.cpp drives src/anim/ -- the module
; is the flight director, the TU here is the rig around it (panel, touch, clock,
; frame timing). Bench-only: no CI row, publishes nothing, makes no cloud calls,
; and touches no product code.
;
; Inherits the SKU's board config from env:blipscope-s3-128 rather than
; restating it, so pins, PSRAM, flash and the partition table can never drift
; from the product. build_src_filter is the exception -- it drops everything and
; re-includes only the harness TU plus the animation module, because
; animtest_main.cpp defines its own setup()/loop() and would otherwise collide
; with main.cpp.
;
; Flash with the port PINNED. A second board is usually attached (the soak), and
; auto-detection has already put an image on the wrong one once:
;   pio run -e animtest-s3-128 -t upload --upload-port COM119 -t monitor
;
; Controls on the glass: tap = pause / step, swipe = jump beat, long-hold =
; replay the beat, long-hold on the TOP BAND = switch time mode.
; ANIM_PROFILE adds the LIFTOFF smoke sub-timer inside the module. Bench-only by
; construction: the flight director's contract is that it holds no wall clock,
; and the smoke is the one draw the harness cannot time from outside (it is a
; single call inside a single frame), so the bracket has to live in there. A
; product build never defines this and gets no micros() call.
[env:animtest-s3-128]
extends = env:blipscope-s3-128
build_src_filter = -<*> +<animtest_main.cpp> +<anim/>
build_flags =
    ${env:blipscope-s3-128.build_flags}
    -DANIM_PROFILE
lib_deps = lovyan03/LovyanGFX @ 1.2.21

; TRUE-TIME variant: beats fire at their published T+ marks and the whole flight
; takes ~31.6 minutes (the §7 Lambert validation case for 9,700 km).
;
; A SEPARATE ENV RATHER THAN ONLY A GESTURE because an unattended capture must be
; reproducible from the flash command alone -- a run whose time mode depended on
; whether somebody long-pressed the top band is a run whose log cannot be trusted
; later. The gesture stays for side-by-side comparison on the bench; this env is
; for the recorded pass that goes in the results doc.
; GLOBE SURVEY: holds MIDCOURSE at 70% (past the cut, track visibly part-flown)
; and walks eight launch/target pairs, four seconds each, tap to advance. The
; camera orientation is DERIVED from the pair, so every scenario is a different
; view of the Earth and a differently shaped arc -- which is the only way to find
; out whether a tilt chosen against one target holds up for the rest.
;
;   pio run -e animtest-s3-128-globe -t upload --upload-port COM119
[env:animtest-s3-128-globe]
extends = env:animtest-s3-128
build_flags =
    ${env:animtest-s3-128.build_flags}
    -DANIM_GLOBE_SURVEY

[env:animtest-s3-128-truetime]
extends = env:animtest-s3-128
; From the ANIMTEST env's flags, not the SKU's -- inheriting the SKU's would
; silently drop -DANIM_PROFILE and the true-time pass would report no smoke cost
; at all, which reads identically to a smoke pass that is free.
build_flags =
    ${env:animtest-s3-128.build_flags}
    -DANIM_TRUE_TIME

; Boot-hold-to-forget probe (src/probe/BootTouchProbe.cpp) -- issue #173. Answers why a
; thumb held from power-on reports touched=0 for the whole 1.2 s detect window. Reading
; Touch_CSTxxx.cpp already ruled out INT gating (the gate only applies when diff_msec<10;
; BootHoldToForget polls at 20 ms) and already ruled out the naive TP_RST fix (tft.init()
; pulses TP_RST every boot as it is). What is left to test on hardware is whether the
; held contact is absorbed into the chip's power-on baseline calibration -- and if it is,
; the feature is unrescuable and comes out of the product. Bench only, COM119.
[env:probe-s3-128-boottouch]
extends = env:probe-s3-128
build_src_filter = +<probe/BootTouchProbe.cpp>
build_flags =
    ${env:probe-s3-128.build_flags}
    -DPROBE_TP_SDA=8
    -DPROBE_TP_SCL=9
    -DPROBE_TP_RST=0
    -DPROBE_TP_INT=11

; ---- OTA pre-flight bench envs (NOT shipping SKUs, no CI row) ----------------------
; The download half of the OTA path has never been observed succeeding: on a real boot
; latest <= current, so the bus acquisition, ReleaseTlsLocked(), the transfer and
; ReleaseBus() are all dead code at runtime. These two envs pin OTA at the
; `ota-preflight-v6` PRE-RELEASE (version.txt = 6) so a FW_VERSION=5 build updates on
; demand. Pre-releases never resolve through /latest, so the fleet cannot see the tag --
; verified: latest/download/version.txt still reads 4 while the pinned tag reads 6.
[env:blipscope-s3-128-otatest]
extends = env:blipscope-s3-128
build_flags =
    ${env:blipscope-s3-128.build_flags}
    -DOTA_RELEASE_BASE=\"https://github.com/Valar-Systems/valar-scopes/releases/download/ota-preflight-v6\"

; As above, but drops the WiFi link at 50% of the transfer. Exercises the failure path
; on purpose: httpUpdate must fail, NoteOtaFailed must record it, ReleaseBus() must run,
; and the device must come back to a working radar rather than wedging with the bus
; held. A partial OTA that bricks a unit is worse than one that never starts.
[env:blipscope-s3-128-otafault]
extends = env:blipscope-s3-128-otatest
build_flags =
    ${env:blipscope-s3-128-otatest.build_flags}
    -DOTA_FAULT_AT_PCT=50

; ---------------------------------------------------------------------------
; D6 -- THE BENCH KIT. Four stations, one sitting.
;
; Daniel is the bottleneck on three separate measurements, so these are built to
; be flashed back to back in one session rather than scheduled three times. The
; runbook is docs/bench-runbook-device-game.md and it is one page on purpose.
;
; Every one of them is the SHIPPING board config with the app swapped out --
; same variant, same qio_opi PSRAM, same partition table -- for the reason
; probe-s3-128-blit already gives: a number measured on a machine we do not ship
; is a confident number about nothing. And the partition table matches so the
; bench board's NVS survives the round trip back to a radar build.
; ---------------------------------------------------------------------------

; Station 1 -- gesture capture. Raw CST816D samples to CSV; the corpus D3 is
; graded against. NO TouchWatchdog: it would silently repair a mid-capture
; dropout and the corpus would show a clean hold on a chip that had reset.
[env:probe-s3-128-gesture]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3-16mb-bignvs.csv
build_src_filter = +<probe/GestureProbe.cpp>
build_flags =
    ${s3128_hw.build_flags}
    -DPROBE_SKETCH

; Station 2 -- screen state. One line per frame of what the renderer DECIDED,
; from four scripted drills driven at exact microseconds. The fixture D4's host
; tests assert against. SCREEN_STATE_PROBE is what a real DrawDrill will compile
; its Note* calls under, so the format outlives this stand-in.
[env:probe-s3-128-screenstate]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3-16mb-bignvs.csv
build_src_filter = +<probe/ScreenStateProbe.cpp> +<game/>
build_flags =
    ${s3128_hw.build_flags}
    -DPROBE_SKETCH
    -DSCREEN_STATE_PROBE

; Station 4 -- the forced-arm runs (§13 B's gate on the crew layer). The flag
; already existed on gametest_main.cpp and was reachable only by hand-passing
; --build-flag; it gets an env so the runbook is four `pio run` lines rather
; than three plus an incantation. ARM=1 here; the runbook drives 2 and 3 with
; -DGAMETEST_ARM=n on the command line, which is the ONE place that is still
; necessary and is called out as such.
[env:gametest-s3-128-arm]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3-16mb-bignvs.csv
build_src_filter = +<gametest_main.cpp> ${filters.editions_off} ${filters.hwtest_off} ${filters.anim_off}
build_flags =
    ${s3128_hw.build_flags}
    -DGAMETEST_FORCE_ARM
    -DGAMETEST_ARM=1

; ===================== FOLLOW MODE stage 1 -- the draw-cost bench =============
; docs/follow-mode-consolidated.md §18.1: "Draw cost of a 256-segment track
; against the 27-31 ms budget, on the s3-128, under a full contact table. This
; decides whether Follow is a track product or a notification product.
; Everything else is contingent on it."
;
; BENCH ONLY. No CI row, publishes nothing, and it is NOT how Follow will ship:
; -DFOLLOW_BENCH fills the track with a synthetic worst case at boot so the
; measurement can be taken in minutes instead of waiting ~2 h for a real
; aeroplane to fly 150 km near the bench. Without that, the number would come off
; a half-empty buffer and be quietly optimistic -- and it is the number that
; decides the product.
;
; Extends the SHIPPING env, not the hw section, so the measurement happens under
; the real render load (overlay, trails, sweep, cloud feed) rather than a
; stripped build that would flatter it.
;
;   pio run -e follow-bench-s3-128 -t upload -t monitor --upload-port COM119
;
; Set the "follow" config key to any prefix (it need not match a real aircraft --
; the synthetic fill does not require a contact) and read the on-screen "trk"
; line, or the [follow] serial line, for mean/max ms.
;
; Sweep the cap without editing code -- the shape of the curve is the second
; thing you want after the first number:
;   pio run -e follow-bench-s3-128 -t upload   # 256, the spec's proposal
;   PLATFORMIO_BUILD_FLAGS=-DFOLLOW_DRAW_SEGMENT_CAP=64  pio run -e follow-bench-s3-128 -t upload
[env:follow-bench-s3-128]
extends = env:blipscope-s3-128
build_flags =
    ${env:blipscope-s3-128.build_flags}
    -DFOLLOW_BENCH
