[platformio]
; The S3 1.28" (Kit S3) is the default SKU and builds by default (`pio run`); build
; another with `pio run -e <env>`.
default_envs = blipscope-s3-128

; Shared build_src_filter fragments so exclusions live in ONE place and can't drift.
; The editions are separate compile-time products and are NOT self-#ifdef-gated, so a
; sibling's TUs must be excluded from every other product or they compile and link into
; the shipped/OTA image. Composing from these fragments means adding edition N+1 touches
; only its own env (drop radar TUs + all editions, then re-include its own dir):
;   radar env   : +<*> ${filters.editions_off}
;   edition env : +<*> ${filters.radar_off} ${filters.editions_off} +<its_dir/>
[filters]
; Radar-only translation units (dropped by every edition build).
radar_off = -<AircraftManager.cpp> -<MqttPublisher.cpp> -<SpecialAircraft.cpp> -<AircraftInfoFields.cpp> -<Logbook.cpp> -<IcaoCountry.cpp> -<models/>
; Every edition directory (dropped by the radar build and by every OTHER edition; each
; edition re-includes its own after this). src/astro/ is the shared ephemeris used only
; by Space, so it lives here and Space re-includes it.
editions_off = -<eam/> -<space/> -<astro/> -<seismic/> -<birding/> -<fishing/> -<claudescope/> -<speed/>
; The standalone hardware-test TU (src/hwtest_main.cpp) defines its own setup()/loop(),
; so it MUST be excluded from every product build or the link fails on duplicate symbols.
; Only [env:hwtest-s3-146] re-includes it.
hwtest_off = -<hwtest_main.cpp>
; The Missileer game bench harness (src/gametest_main.cpp) -- same rule as the
; hardware test above: it defines its own setup()/loop(), so it MUST be excluded
; from every product build or the link fails on duplicate symbols. Only
; [env:gametest-s3-128] re-includes it.
gametest_off = -<gametest_main.cpp>
; The Missileer flight-animation rig: its harness TU (own setup()/loop(), same
; duplicate-symbol rule as the two above) AND the animation module it drives.
;
; The MODULE is excluded for a different reason from the harness, and the
; distinction matters. src/anim/ is not test scaffolding -- it is the flight
; director the game will consume, written to be lifted (own namespace, draws
; into a caller-supplied sprite, no harness types in its surface). It is dropped
; here only because nothing in a shipping SKU calls it yet, and dead code in an
; image that is already tight on flash (min_spiffs, OTA needs the room) is a
; cost with no benefit today.
;
; THE DAY A PRODUCT CONSUMES IT, that env stops applying this fragment and
; re-includes +<anim/> -- exactly how the edition dirs work above. Nothing about
; the module has to change for that.
anim_off = -<anim/> -<animtest_main.cpp>

; THAT DAY IS 2026-08-27, and this is the fragment the radar env applies instead.
; Follow Mode's globe face (spec 9) consumes the module's projection and its
; coastline set, so the radar SKUs now compile src/anim/ while still dropping the
; harness TU. The editions are unaffected: each spells out ${filters.anim_off} in
; its own build_src_filter and keeps the module out.
;
; A SEPARATE POSITIVE FRAGMENT RATHER THAN "${filters.anim_off} +<anim/>". A
; build_src_filter is order-dependent, and this repo has already paid once for
; assuming a later token beats an earlier one -- the -U/-D asymmetry that built a
; bench env with no backend URL and compiled clean. Saying it once, positively,
; removes the question.
;
; The premise that dropped it -- "an image already tight on flash (min_spiffs)" --
; is stale for these SKUs anyway: [env:blipscope-s3-128] overrides the partition
; table. Measured cost of the re-include is in the commit that made it.
animtest_off = -<animtest_main.cpp>

; Settings shared by every Blipscope SKU. Each [env:*] below picks a board and a
; -DBLIPSCOPE_VARIANT_* flag; the matching header in include/variants/ supplies pins,
; the display/touch driver selection, and capability flags. Adding a SKU = add one
; variant header + one [env:*] here; no shared firmware changes.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
; Pre-build patches re-applied on every build so they survive a fresh library install (.pio/
; is gitignored): (1) the ASYNC_RESPONCE_BUFF_SIZE #ifndef guard on ESPAsyncWebServer so the
; -D override below takes effect; (2) restore the shared LCD_CAM interrupt flag in LovyanGFX's
; RGB bus so the S3 RGB panel's interrupt can be allocated (see the script for the full why).
; (3) boot_app0.bin is appended by the platform at a hardcoded 0xe000, which is
; inside the s3-128's enlarged nvs -- an ordinary upload would corrupt the device
; config it just wrote. Re-points it at the table's real otadata offset; a no-op
; on the stock tables, where otadata genuinely is at 0xe000.
extra_scripts =
    pre:scripts/patch_async_buff.py
    pre:scripts/patch_lgfx_rgb_intr.py
    post:scripts/fix_boot_app0_offset.py
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    ; BUILD IDENTITY. Here in [common] deliberately, so no env can opt out and a
    ; new env gets it for free. A wrong-env flash is indistinguishable from a
    ; hardware or upstream fault from the outside: flashing the non-cloud
    ; blipscope-s3-128 over a cloud board produced "no leaderboard submits",
    ; "stale data, sweep stops" and "photos never load" at once, and an hour went
    ; into diagnosing an airspace-capacity ceiling that was not there. The device
    ; must be able to say what it is, on the banner and on the config page,
    ; without anyone knowing which log lines exist in which build.
    -DBUILD_ENV=\"$PIOENV\"
    ; Shrink ESPAsyncWebServer's per-send buffer from 2x TCP_MSS (2872 B) to 1 KB so it
    ; fits a fragmented heap on the tightest board; roomier boards are unaffected.
    -DASYNC_RESPONCE_BUFF_SIZE=1024
; Default source set: the radar app. Every edition dir is dropped here (see [filters]);
; each edition env below re-includes only its own dir. Written as one shared exclusion
; list rather than per-env hand-maintained lists so adding edition N+1 can't silently
; leave a sibling's TUs linked into another product (they are not #ifdef-gated).
build_src_filter = +<*> ${filters.editions_off} ${filters.hwtest_off} ${filters.gametest_off} ${filters.animtest_off}
board_build.partitions = min_spiffs.csv
lib_deps =
    lovyan03/LovyanGFX @ 1.2.21
    tzapu/WiFiManager @ 2.0.17
    ESP32Async/ESPAsyncWebServer @ 3.11.1
    ESP32Async/AsyncTCP @ 3.4.10
    bblanchon/ArduinoJson @ 7.4.3
    knolleary/PubSubClient @ 2.8

; ---- cloud backend, named exactly once per env -------------------------------
; CLOUD_FEED_BASE is defined in ONE place per env. The tempting alternative -- define
; production in the shipping env, then -U and redefine it in a bench env -- DOES NOT
; WORK under PlatformIO, and fails silently. -U lands in CCFLAGS while -D lands in
; CPPDEFINES, so the undefine wins whatever order this file puts them in; the build
; then falls through CloudFeed.h's `#ifndef CLOUD_FEED_BASE -> ""` and produces a radar
; with NO backend that compiles clean and boots to an empty screen. Measured 2026-08-08
; while making this very change: blipscope-s3-128-cloud built with an empty base URL.
;
; So bench envs compose from the URL-free *_hw sections plus one of these, rather than
; inheriting the shipping env's flags and trying to take the URL back out.
[cloud]
prod    = -DFEATURE_CLOUD_FEED -DCLOUD_FEED_BASE=\"https://scopes.valarsystems.com\"
staging = -DFEATURE_CLOUD_FEED -DCLOUD_FEED_BASE=\"https://scopes-staging.valarsystems.com\"

; Board flags WITHOUT a backend, so each env picks its own exactly once. A shipping env
; is these plus ${cloud.prod}; a bench env is these plus ${cloud.staging}.
[s3128_hw]
build_flags =
    ${common.build_flags}
    -DBLIPSCOPE_VARIANT_S3_128
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; assumed native USB-CDC (typical of these clones)

[s3146_hw]
build_flags =
    ${common.build_flags}
    -DBLIPSCOPE_VARIANT_S3_146
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; native USB-CDC: upload + monitor over the USB-C port


; ===================== Blipscope Kit S3 (jxl 1.28" round, S3R8) ========
; THE DEFAULT SKU (default_envs above) and what the pilot fleet ships on: "jxl"-brand
; ESP32-S3R8 clone of the 1.28" GC9A01 + CST816 round board (PCF85063 RTC, QMI8658 IMU,
; spk/mic, TF, 2x WS2812, 5 buttons). Pin map VERIFIED on hardware 2026-07-09 (probe
; phase 2); graduated to a CI release row 2026-07-15.
;
; It began as the candidate replacement for the ESP32-C3 Kit, which was retired
; 2026-06-29, briefly revived bench-only for the cloud-feed program, and deleted
; outright 2026-08-09 -- variant header, envs and the wedge-bisection harness with it.
;
; This is the one SKU whose HARDWARE needs a per-batch acceptance gate before it ships:
; the touch IC's factory config and the u.FL-vs-chip antenna build are both silent,
; per-batch substitution risks. See INCOMING-INSPECTION.md.
[env:blipscope-s3-128]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi    ; S3R8: 8 MB octal PSRAM (flash size TBD)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; 84 KB NVS instead of the stock 20 KB -- see partitions-s3-16mb-bignvs.csv for the
; measurement that forced it (20 KB was full with the logbook at only 36% of usage).
; Factory-flash only: OTA never rewrites the partition table, so boards already in
; the field keep the stock layout and keep taking updates normally. Scoped to this
; SKU deliberately -- the other S3 envs still use default_16MB.csv.
board_build.partitions = partitions-s3-16mb-bignvs.csv
build_flags =
    ${s3128_hw.build_flags}
    ; Declares which table this image EXPECTS, so Logbook::reportCapacity() can
    ; check it against the partition the board actually booted. It must move with
    ; the line above: an env that takes bignvs without this flag simply loses the
    ; check, and one that sets it without the table warns on every boot.
    ; The failure it exists for is silent -- a differing table relocates NVS and
    ; the logbook, location, WiFi and device key all become unreachable at once,
    ; presenting as "my Blipscope forgot everything".
    -DBLIPSCOPE_EXPECT_BIG_NVS

    ; ---- SHIPS AS A CLOUD RADAR ----------------------------------------------
    ; This env is what the CI release matrix builds and what devices OTA into, so it
    ; must BE the shipping image. It was not: the cloud feed lived only in a separate
    ; -prodburn env, so a board flashed for the pilot would take its first OTA and come
    ; back with the feed compiled out. Nothing reports that -- a non-cloud image simply
    ; stops contacting the proxy, which reads as a quiet device, not a fault.
    ; RULE: the env named in .github/workflows/firmware.yml IS the product. Anything the
    ; product needs belongs here, never in a sibling env CI does not build.
    ; scripts/check_release_envs.mjs enforces it.
    ${cloud.prod}

; FETCH-TRACE -- the shipping image plus fetch instrumentation, and NOTHING else.
;
; Exists because the two SOAK_TEST envs below cannot answer a question about an
; idle board. Both of them (a) point at ${cloud.staging} rather than production,
; and (b) arm SoakHarness, which synthesises taps (AircraftManager.cpp:3706). For
; the 2026-08-17 heap-fragmentation investigation each of those changes the thing
; being measured: the backend differs from the control board's, and the harness
; injects the exact variable the first (wrong) hypothesis blamed.
;
; So this env extends the SHIPPING env and adds one flag. build_flags is restated
; in full because PlatformIO REPLACES rather than appends -- including
; -DBLIPSCOPE_EXPECT_BIG_NVS, which must travel with board_build.partitions above
; or the image silently loses the table check it inherits the table for.
;
; Verify the artifact, not this comment: the ELF must contain the PRODUCTION host
; and must NOT contain SoakHarness. `bash scripts/check-fetchtrace.sh` does both.
; TLS-PSRAM -- the shipping image plus issue #245's fix, and NOTHING else.
;
; The A/B partner for a plain shipping board: same env, same backend, same sky,
; one flag apart. #245 kills enrichment after roughly a day of uptime because
; mbedTLS is pinned to internal RAM (CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=y in the
; prebuilt Arduino libs) and its 16 KB record buffer can no longer find a
; contiguous internal block. -DBLIPSCOPE_TLS_PSRAM routes mbedTLS allocations at
; or above 4 KB to PSRAM instead, of which every SKU has ~8.2 MB free.
;
; build_flags is restated IN FULL for the same reason fetchtrace restates it:
; PlatformIO REPLACES rather than appends, and -DBLIPSCOPE_EXPECT_BIG_NVS must
; travel with board_build.partitions or the image silently loses the table check.
;
; Verify the artifact: the ELF must contain the tls-alloc INSTALLED string, and
; the board must print [tls-alloc] PSRAM routing INSTALLED at boot. A build that
; silently lost the flag prints the NOT built in line instead -- deliberately,
; so the control and the treatment are never confusable from a capture alone.
[env:blipscope-s3-128-tlspsram]
extends = env:blipscope-s3-128
build_flags =
    ${s3128_hw.build_flags}
    -DBLIPSCOPE_EXPECT_BIG_NVS
    ${cloud.prod}
    -DBLIPSCOPE_TLS_PSRAM

[env:blipscope-s3-128-fetchtrace]
extends = env:blipscope-s3-128
build_flags =
    ${s3128_hw.build_flags}
    -DBLIPSCOPE_EXPECT_BIG_NVS
    ${cloud.prod}
    -DFETCH_TRACE

; Wedge soak: cloud feed + SOAK_TEST + the human-duty gesture script, with the touch
; watchdog active via the variant flag. The [health]/[soak] ledger is the same shape the
; retired C3 emitted, so bench-logs/c3-soak-baseline-2026-07-10.log stays readable
; side-by-side as the historical baseline (the board is gone; the comparison isn't).
[env:blipscope-s3-128-soak]
extends = env:blipscope-s3-128
build_flags =
    ; hw section + staging, NOT the parent's build_flags: the parent ships PRODUCTION
    ; now, and a macro cannot be taken back out (see the [cloud] note above).
    ${s3128_hw.build_flags}
    ${cloud.staging}
    -DSOAK_TEST
    ; OTA pinned to the pre-gate tag (invisible to the fleet's /latest): the
    ; weekend gate's OTA-at-steady-state leg. version.txt is withheld from the
    ; release until the 24 h line -- uploading it + setting minFw=5 in staging
    ; KV arms the update mid-run without touching the device.
    -DOTA_RELEASE_BASE=\"https://github.com/Valar-Systems/valar-scopes/releases/download/pregate-s3-128-v5\"

; DENSE-SKY SOAK -- the launch bar, not an edge case. Some of the 50 pilot units
; will live under LAX / JFK / ATL, and a dense sky is where the shared depth-1
; enrich queue saturates: the tracked set pins at MAX_AIRCRAFT and churns, so any
; request that is not preemptive loses every race. That is how the hourly
; leaderboard submit reached zero landings at LAX + 10 mi while nothing errored.
;
; Set the device's location to the coordinates below on the config page before
; running (location is NVS, deliberately not a build flag -- baking a position in
; would make the harness lie about which config it soaked):
;
;     lat 33.943324   lon -118.409144   radius 10 mi     ; LAX threshold
;
; GATE: every due submit must go away within LB_SUBMIT_GATE_MS of becoming due.
; The device prints "[leaderboard] submit away after N ms (worst M ms)" on each
; one, so the run is auditable from the serial log alone. 120 s is generous
; against a ~1-2 s enrich cycle -- it is a starvation detector, not a latency
; benchmark, and a gate that trips on a slow afternoon gets ignored.
[env:blipscope-s3-128-densesky]
extends = env:blipscope-s3-128
build_flags =
    ; hw section + staging, NOT the parent's build_flags: the parent ships PRODUCTION
    ; now, and a macro cannot be taken back out (see the [cloud] note above).
    ${s3128_hw.build_flags}
    ${cloud.staging}
    -DSOAK_TEST
    -DLB_SUBMIT_GATE_MS=120000

; The Kit S3 (1.28") with the cloud feed but WITHOUT SOAK_TEST -- a clean,
; manually-testable cloud build (the soak env above simulates taps via its duty
; script, which fights manual detail-card testing). Same STAGING base + no baked
; key as the s3-146 cloud env; paste the access key on the config page after
; flashing. Bench-only, like the other s3-128 cloud envs (no CI/release row).
[env:blipscope-s3-128-cloud]
extends = env:blipscope-s3-128
build_flags =
    ; hw section + staging, NOT the parent's build_flags: the parent ships PRODUCTION
    ; now, and a macro cannot be taken back out (see the [cloud] note above).
    ${s3128_hw.build_flags}
    ${cloud.staging}

; Incoming inspection (flash THIS first, before any firmware env): I2C census + CST816
; identity + the 0xFE DisAutoSleep accessibility experiment, over the same lgfx::i2c
; path as TouchWatchdog so ACK/NACK results compare 1:1 with the C3 finding. Only
; src/probe/TouchProbe.cpp compiles. Pin overrides: -DPROBE_TP_SDA/SCL/RST/INT/ADDR.
[env:probe-s3-128]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_src_filter = +<probe/TouchProbe.cpp>
build_flags =
    ${common.build_flags}
    -DPROBE_SKETCH
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Heap-metric probe (src/probe/HeapProbe.cpp). Answers one question: does
; ESP.getMaxAllocHeap() measure the memory a TLS handshake actually needs? The
; 54 h soak's OTA check failed a 16,717 B caps-0x804 alloc while the health line
; reported largest=31732, so one of those numbers is not what it is read as.
; See the file header; the verdict is the last PROBE, line it prints.
[env:probe-s3-128-heap]
extends = env:probe-s3-128
build_src_filter = +<probe/HeapProbe.cpp>

; Blit probe (src/probe/BlitProbe.cpp). Answers the one number the full-bleed
; 240x240 detail card was scoped on without measuring: what a 240^2 PSRAM sprite
; costs per frame versus today's 150x100, and whether the fillScreen it makes
; redundant pays for it. Also holds a 240^2 sprite + a 20 KB payload live and
; trial-allocates a real handshake against the remainder.
;
; NOT extended from env:probe-s3-128: that env carries no BLIPSCOPE_VARIANT_* and
; no PSRAM memory_type (TouchProbe talks to raw lgfx::i2c and needs neither). A
; blit measured with the sprite in internal RAM instead of PSRAM would be a
; confident number about a machine we do not ship. This env is the SHIPPING board
; config with the app swapped out -- same variant, same qio_opi PSRAM, same
; partition table so the bench board's NVS survives the round trip back to v6.
[env:probe-s3-128-blit]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3-16mb-bignvs.csv
build_src_filter = +<probe/BlitProbe.cpp>
build_flags =
    ${s3128_hw.build_flags}
    -DPROBE_SKETCH

; LogbookProbe: the v5 caps, eviction and the v4->v5 operator migration.
;
; These paths are unreachable by using the product. Eviction needs a store at its
; cap, which took a week of GA-heavy sky at the OLD caps and is 2x further away at
; the new ones; the migration only fires against a store written by firmware that
; is no longer running. So they get driven directly instead of waited for.
;
; Same shape as probe-s3-128-blit: the SHIPPING board config with the app swapped
; out, so nothing measured here is a fact about a machine we do not ship. The probe
; never calls Begin() or MaybePersist(), so flashing it cannot harm the bench
; board's logbook -- but keep the partition table matching anyway, so the trip back
; to a radar build leaves NVS untouched.
[env:probe-s3-128-logbook]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-s3-16mb-bignvs.csv
build_src_filter = +<probe/LogbookProbe.cpp> +<Logbook.cpp>
build_flags =
    ${s3128_hw.build_flags}
    -DPROBE_SKETCH

; Probe phase 2, on the bus the sweep verified (SDA=8 SCL=9): hunt the TP_INT pin
; (falling-edge counters on every safe unclaimed GPIO while a finger drags) and
; test the TP_RST=GPIO0 hypothesis (drive low -> CTP must NACK; release -> re-ACK
; after the 450 ms boot). Results land in include/variants/s3_128.h and arm the
; watchdog's hard rung + INT-gated touch reads before the ship-config soak.
[env:probe-s3-128-phase2]
extends = env:probe-s3-128
build_flags =
    ${env:probe-s3-128.build_flags}
    -DPROBE_PHASE2
    -DPROBE_TP_SDA=8
    -DPROBE_TP_SCL=9
    -DPROBE_TP_RST=0

; ===================== Blipscope Pro 2.1 (S3 test board) ==============
; Waveshare ESP32-S3-Touch-LCD-2.1: ESP32-S3R8 + 2.1" round ST7701 480x480 RGB LCD +
; CST820 touch + QMI8658 IMU + buzzer. First S3 SKU and first RGB-bus panel. The panel/
; touch reset and the ST7701 init chip-select sit on a TCA9554 I2C expander; variant::
; BoardPreInit() (src/board/board_s3_touch21.cpp) drives it before tft.init(). PSRAM +
; dual-core, so the variant sets BANDED_RENDER=false.
[env:blipscope-pro-s3-21]
extends = common
board = esp32-s3-devkitc-1                   ; generic S3; flash/PSRAM pinned below
board_build.arduino.memory_type = qio_opi    ; 16 MB QIO flash + 8 MB OCTAL PSRAM (the R8)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv    ; the RGB build is larger than the C3's; 16 MB gives OTA room
build_flags =
    ${common.build_flags}
    -DBLIPSCOPE_VARIANT_S3_21
    -DBOARD_HAS_PSRAM

    ; ---- SHIPS AS A CLOUD RADAR ----------------------------------------------
    ; This env is what the CI release matrix builds and what devices OTA into, so it
    ; must BE the shipping image. It was not: the cloud feed lived only in a separate
    ; -prodburn env, so a board flashed for the pilot would take its first OTA and come
    ; back with the feed compiled out. Nothing reports that -- a non-cloud image simply
    ; stops contacting the proxy, which reads as a quiet device, not a fault.
    ; RULE: the env named in .github/workflows/firmware.yml IS the product. Anything the
    ; product needs belongs here, never in a sibling env CI does not build.
    ; scripts/check_release_envs.mjs enforces it.
    ${cloud.prod}
    ; NB: -DBLIPSCOPE_BRINGUP_DIAG (a ~10.5 s boot-time color-flash panel/PSRAM diagnostic,
    ; #ifdef block still in main.cpp) is intentionally OFF: this env ships in the CI release
    ; matrix, so the flag would run the diagnostic on every customer boot / OTA. Re-enable it
    ; only for a local bring-up build, never on a released env.
; Serial goes to UART0 (no ARDUINO_USB_CDC_ON_BOOT) -> use the board's CH343P UART USB port for
; upload + monitor; it auto-resets and doesn't drop on reboot, so it captures the full boot log.

; ===================== Blipscope 1.46 (S3 1.46" round) ================
; Waveshare ESP32-S3-Touch-LCD-1.46B: ESP32-S3R8 + 1.46" round 412x412 IPS (SPD2010 over QSPI) +
; SPD2010 touch + QMI8658 IMU + PCM5101 I2S speaker. The SPD2010 is a TDDI chip (display + touch in
; one), and LovyanGFX has neither driver, so both are custom: include/Panel_SPD2010.hpp (subclasses
; lgfx::Panel_AMOLED) and include/Touch_SPD2010.hpp (an lgfx::ITouch). Panel/touch reset sit on a
; TCA9554 expander driven by variant::BoardPreInit() (src/board/board_s3_touch146.cpp).
; LovyanGFX enables its QSPI bus automatically on the S3 (LGFX_USE_QSPI). This board uses native
; USB-CDC (303A:1001), so upload + monitor run over the USB-C port. PSRAM + dual-core:
; BANDED_RENDER=false.
[env:blipscope-s3-146]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi    ; 16 MB QIO flash + 8 MB OCTAL PSRAM (the R8)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv    ; 16 MB gives OTA room
build_flags =
    ${s3146_hw.build_flags}

    ; ---- SHIPS AS A CLOUD RADAR ----------------------------------------------
    ; This env is what the CI release matrix builds and what devices OTA into, so it
    ; must BE the shipping image. It was not: the cloud feed lived only in a separate
    ; -prodburn env, so a board flashed for the pilot would take its first OTA and come
    ; back with the feed compiled out. Nothing reports that -- a non-cloud image simply
    ; stops contacting the proxy, which reads as a quiet device, not a fault.
    ; RULE: the env named in .github/workflows/firmware.yml IS the product. Anything the
    ; product needs belongs here, never in a sibling env CI does not build.
    ; scripts/check_release_envs.mjs enforces it.
    ${cloud.prod}

; ===================== Blipscope 1.46 CLOUD (staging bench) ===========
; The S3 1.46" with -DFEATURE_CLOUD_FEED: the radar gains the "Blipscope Cloud"
; data source (default) backed by the proxy/ Worker -- one keep-alive TLS host,
; <=2 KB payloads, /v1/config-driven active/idle/night cadence, tap-to-enrich.
; Kept as a SEPARATE env pointed at STAGING until bench-verified; the release
; env above ships unchanged. Promotion later = move the flag + a production
; CLOUD_FEED_BASE into [env:blipscope-s3-146] and delete this env.
; The device key is NOT baked here (key policy: values never appear in the
; repo): paste it into the config page's "Access key" field after flashing, or
; add a local -DCLOUD_FEED_KEY=\"...\" build flag that never gets committed.
[env:blipscope-s3-146-cloud]
extends = env:blipscope-s3-146
build_flags =
    ; hw section + staging, NOT the parent's build_flags: the parent ships PRODUCTION
    ; now, and a macro cannot be taken back out (see the [cloud] note above).
    ${s3146_hw.build_flags}
    ${cloud.staging}

; ---- the former *-prodburn envs, COLLAPSED 2026-08-08 ----------------------
; blipscope-s3-128-prodburn / blipscope-s3-146-prodburn were "point a bench board at
; production" envs adding -DFEATURE_CLOUD_FEED + the production CLOUD_FEED_BASE on top
; of their base. Their own note said to delete them once the shipping switch happened.
; It has: those flags now live in the base envs, so these were exact duplicates of
; their parents and are gone.
;
; Worth a paragraph rather than a silent deletion, because their existence is how the
; pilot nearly shipped wrong: the image the boards were to be flashed from was NOT the
; image CI builds or that OTA serves, and the difference was invisible. If you find
; yourself adding a "-prod" or "-real" variant of a shipping env again, that is the
; smell -- put the flag in the env CI builds, or it is not what ships.

